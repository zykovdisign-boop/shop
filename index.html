<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Что купить</title>
<meta name="description" content="Напишите, что готовите и на сколько человек — список покупок соберётся сам, разложится по отделам и посчитает примерную сумму.">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="data.js"></script>
<style>
:root {
  --bg: var(--tg-theme-bg-color, #ffffff);
  --bg2: var(--tg-theme-secondary-bg-color, #f2f3ef);
  --text: var(--tg-theme-text-color, #1d1f1c);
  --hint: var(--tg-theme-hint-color, #8a8f86);
  --accent: var(--tg-theme-button-color, #2f9e55);
  --accent-text: var(--tg-theme-button-text-color, #ffffff);
  --link: var(--tg-theme-link-color, #2f9e55);
  --line: color-mix(in srgb, var(--text) 10%, transparent);
  --soft: color-mix(in srgb, var(--accent) 12%, transparent);
  --warn: #e0912a;
  --danger: #d9534f;
  --radius: 16px;
}
@media (prefers-color-scheme: dark) {
  html:not(.tg):not([data-theme]) {
    --bg: #171916; --bg2: #0f110e; --text: #eceee9; --hint: #8f968b; --accent: #43b86a; --link: #6fd08f;
  }
}
html[data-theme="light"] { --bg: #ffffff; --bg2: #f2f3ef; --text: #1d1f1c; --hint: #8a8f86; --accent: #2f9e55; --accent-text: #fff; --link: #2f9e55; }
html[data-theme="dark"] { --bg: #1b1d1a; --bg2: #111310; --text: #eceee9; --hint: #8f968b; --accent: #43b86a; --accent-text: #fff; --link: #6fd08f; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg2); color: var(--text);
  font: 16px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
body { padding-bottom: calc(80px + env(safe-area-inset-bottom)); }
body.has-cta { padding-bottom: calc(146px + env(safe-area-inset-bottom)); }
body.lock { overflow: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
input, textarea, select { font: inherit; color: var(--text); }
img { display: block; }
.wrap { max-width: 560px; margin: 0 auto; padding: 10px 16px 24px; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
h1 { font-size: 24px; margin: 6px 0 2px; letter-spacing: -.01em; }
.gear { width: 40px; height: 40px; border-radius: 12px; background: var(--bg); font-size: 20px; }
.sub { color: var(--hint); font-size: 14px; margin: 0 0 14px; }
.card { background: var(--bg); border-radius: var(--radius); padding: 14px; margin-bottom: 12px; }
.card > h2, .h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--hint); margin: 0 0 10px; font-weight: 600; }
.muted { color: var(--hint); }
.small { font-size: 13px; }
.row { display: flex; gap: 10px; align-items: center; justify-content: space-between; }
.empty { color: var(--hint); font-size: 14px; padding: 4px 0; }
.note { font-size: 13px; color: var(--hint); margin-top: 8px; }
.primary { display: block; width: 100%; background: var(--accent); color: var(--accent-text); border-radius: 12px; padding: 14px; font-weight: 600; text-align: center; }
.secondary { display: block; width: 100%; background: var(--soft); color: var(--link); border-radius: 12px; padding: 12px; font-weight: 600; text-align: center; }
.ghost { color: var(--link); font-size: 15px; }
.danger { color: var(--danger); }
.field { width: 100%; border: 1.5px solid var(--line); background: var(--bg2); border-radius: 12px; padding: 11px 13px; outline: none; }
.field:focus { border-color: var(--accent); }

/* поиск */
.search { position: relative; }
.search .field { padding-right: 46px; }
.search .go { position: absolute; right: 6px; top: 6px; width: 34px; height: 34px; border-radius: 9px; background: var(--accent); color: var(--accent-text); font-size: 20px; line-height: 34px; }
.drop { position: absolute; left: 0; right: 0; top: calc(100% + 4px); background: var(--bg); border-radius: 12px; box-shadow: 0 8px 28px rgba(0,0,0,.18); z-index: 5; overflow: hidden; }
.drop button { display: flex; gap: 10px; align-items: center; width: 100%; text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); }
.drop button:last-child { border-bottom: 0; }

/* мелкие элементы */
.stepper { display: inline-flex; align-items: center; background: var(--bg2); border-radius: 10px; flex: none; }
.stepper button { width: 36px; height: 34px; font-size: 20px; color: var(--accent); }
.stepper span { min-width: 26px; text-align: center; font-weight: 600; }
.stepper.big button { width: 56px; height: 56px; font-size: 28px; }
.stepper.big span { min-width: 60px; font-size: 32px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { background: var(--bg2); border-radius: 999px; padding: 7px 12px; font-size: 14px; }
.chip.on { background: var(--accent); color: var(--accent-text); }
.chip.old { box-shadow: inset 0 0 0 1.5px var(--warn); }
.chip.off { opacity: .45; text-decoration: line-through; }
.seg { display: flex; background: var(--bg2); border-radius: 10px; padding: 3px; gap: 3px; }
.seg button { flex: 1; padding: 7px 6px; border-radius: 8px; font-size: 14px; }
.seg button.on { background: var(--bg); box-shadow: 0 1px 3px rgba(0,0,0,.12); font-weight: 600; }
.vars { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.vars button { font-size: 12px; padding: 3px 9px; border-radius: 999px; background: var(--bg2); }
.vars button.on { background: var(--soft); color: var(--link); font-weight: 600; }
.vars button.off { opacity: .4; text-decoration: line-through; }
.warn { color: var(--warn); font-size: 13px; }
.switch { position: relative; width: 48px; height: 28px; background: var(--line); border-radius: 999px; flex: none; transition: .2s; }
.switch::after { content: ""; position: absolute; left: 3px; top: 3px; width: 22px; height: 22px; background: #fff; border-radius: 50%; transition: .2s; box-shadow: 0 1px 3px rgba(0,0,0,.25); }
.switch.on { background: var(--accent); }
.switch.on::after { left: 23px; }
.set-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.set-row:last-child { border-bottom: 0; }

/* блюда */
.thumb { width: 48px; height: 48px; border-radius: 12px; background: var(--bg2); flex: none; overflow: hidden; display: grid; place-items: center; font-size: 24px; }
.thumb img { width: 100%; height: 100%; object-fit: cover; }
.dish { display: flex; align-items: flex-start; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.dish:last-child { border-bottom: 0; }
.dish .name { flex: 1; min-width: 0; text-align: left; }
.dish .name b { font-weight: 500; display: block; }
.dish .name small { color: var(--hint); font-size: 13px; }
.dish .rm { color: var(--hint); font-size: 22px; width: 28px; height: 34px; }
.rlist .dish { align-items: center; width: 100%; }
.mdish { padding: 8px 0 10px; border-bottom: 1px solid var(--line); }
.mdish:last-child { border-bottom: 0; }
.mdish .dish { border: 0; padding: 0; align-items: center; }
.mrow { margin: 8px 0 0 58px; align-items: flex-start; }
.mrow .vars { margin-top: 4px; }
details.grp { border-bottom: 1px solid var(--line); }
details.grp:last-child { border-bottom: 0; }
details.grp summary { list-style: none; padding: 12px 0; font-weight: 600; display: flex; justify-content: space-between; cursor: pointer; }
details.grp summary::-webkit-details-marker { display: none; }
details.grp summary::after { content: "›"; color: var(--hint); transform: rotate(90deg); transition: .2s; }
details.grp[open] summary::after { transform: rotate(-90deg); }

/* список */
.total { font-size: 28px; font-weight: 700; letter-spacing: -.02em; }
.progress { height: 6px; background: var(--bg); border-radius: 3px; overflow: hidden; margin: 8px 0 12px; }
.progress i { display: block; height: 100%; background: var(--accent); transition: width .25s; }
.sec h2 { display: flex; justify-content: space-between; }
.item { display: flex; gap: 12px; align-items: flex-start; padding: 11px 0; border-bottom: 1px solid var(--line); }
.item:last-child { border-bottom: 0; }
.item .tap { display: flex; gap: 12px; align-items: flex-start; flex: 1; min-width: 0; text-align: left; }
.box { flex: none; width: 26px; height: 26px; border-radius: 8px; border: 2px solid var(--line); display: grid; place-items: center; color: var(--accent-text); font-size: 15px; transition: .15s; }
.item.done .box { background: var(--accent); border-color: var(--accent); }
.item .t { flex: 1; min-width: 0; }
.item .q { opacity: .72; font-size: 14px; }
.item .for { color: var(--hint); font-size: 12px; }
.item.done .n, .item.done .q { text-decoration: line-through; opacity: .5; }
.price { flex: none; font-size: 13px; color: var(--hint); padding: 3px 0 3px 6px; white-space: nowrap; }
.price.mine { color: var(--link); }
.home-item { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--line); gap: 8px; }
.home-item:last-child { border-bottom: 0; }
.home-item button { color: var(--link); font-size: 14px; white-space: nowrap; }
.add { display: flex; gap: 8px; }
.add .field { flex: 1; min-width: 0; }
.add button { background: var(--accent); color: var(--accent-text); border-radius: 12px; padding: 0 16px; font-weight: 600; font-size: 20px; }
.cart summary { cursor: pointer; font-weight: 600; list-style: none; display: flex; justify-content: space-between; }
.cart summary::-webkit-details-marker { display: none; }
.order li { display: flex; justify-content: space-between; align-items: center; padding: 5px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
.order ol { margin: 0; padding-left: 20px; }
.order button { width: 34px; height: 30px; color: var(--accent); }

/* история */
.trip summary { list-style: none; cursor: pointer; }
.trip summary::-webkit-details-marker { display: none; }
.trip .items { font-size: 14px; margin: 10px 0; color: var(--text); opacity: .85; }
.trip .items div { padding: 3px 0; border-bottom: 1px dashed var(--line); display: flex; justify-content: space-between; gap: 8px; }

/* всплывающие окна */
.sheet { position: fixed; inset: 0; z-index: 30; background: rgba(0,0,0,.4); display: flex; align-items: flex-end; justify-content: center; }
.sheet .panel { background: var(--bg2); width: 100%; max-width: 560px; max-height: 94vh; overflow-y: auto; border-radius: 20px 20px 0 0; padding: 0 0 calc(24px + env(safe-area-inset-bottom)); animation: up .22s ease-out; }
.sheet.center { align-items: center; padding: 16px; }
.sheet.center .panel { border-radius: 20px; max-height: 80vh; }
@keyframes up { from { transform: translateY(40px); opacity: .5; } }
.panel .in { padding: 14px 16px 0; }
.close { position: sticky; top: 0; float: right; margin: 10px 10px 0 0; width: 34px; height: 34px; border-radius: 50%; background: var(--bg); font-size: 20px; z-index: 2; box-shadow: 0 1px 4px rgba(0,0,0,.15); }
.hero { width: 100%; aspect-ratio: 16/10; object-fit: cover; background: var(--bg); }
.hero-emoji { height: 120px; display: grid; place-items: center; font-size: 64px; background: var(--bg); }
.credit { font-size: 11px; color: var(--hint); padding: 4px 16px 0; }
.credit a { color: var(--hint); }
.ing { display: flex; justify-content: space-between; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
.ing:last-child { border-bottom: 0; }
.ing span:last-child { color: var(--hint); text-align: right; }
.steps { margin: 0; padding-left: 22px; }
.steps li { padding: 6px 0; }
.steps li::marker { color: var(--accent); font-weight: 700; }
.btns { display: grid; gap: 8px; }
.erow { display: grid; grid-template-columns: 1fr 76px 64px 28px; gap: 6px; align-items: center; margin-bottom: 6px; }
.erow .field { padding: 9px 10px; }
.erow .u { font-size: 14px; color: var(--hint); text-align: center; }
.photo-pick { display: flex; gap: 12px; align-items: center; }
.photo-pick .thumb { width: 72px; height: 72px; }

/* первый запуск */
.onb { position: fixed; inset: 0; z-index: 40; background: var(--bg2); overflow-y: auto; }
.onb .wrap { min-height: 100%; display: flex; flex-direction: column; padding-top: 40px; }
.onb h1 { font-size: 28px; }
.onb .grow { flex: 1; }
.dots { display: flex; gap: 6px; justify-content: center; margin: 16px 0; }
.dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
.dots i.on { background: var(--accent); }

/* реклама */
.ad { background: var(--bg); border-radius: var(--radius); padding: 12px 14px; margin-bottom: 12px; font-size: 14px; }
.ad .lbl { font-size: 11px; color: var(--hint); text-transform: uppercase; letter-spacing: .05em; }
.ad a { color: var(--link); text-decoration: none; font-weight: 600; }
.ad:empty { display: none; }

/* нижняя панель */
.cta { position: fixed; left: 0; right: 0; bottom: calc(62px + env(safe-area-inset-bottom)); padding: 8px 16px; z-index: 9; }
.cta .primary { max-width: 528px; margin: 0 auto; box-shadow: 0 6px 20px rgba(0,0,0,.18); }
nav { position: fixed; left: 0; right: 0; bottom: 0; background: var(--bg); border-top: 1px solid var(--line); display: flex; padding: 6px 6px calc(6px + env(safe-area-inset-bottom)); z-index: 10; }
nav button { flex: 1; padding: 6px 2px; border-radius: 10px; font-size: 12px; color: var(--hint); display: flex; flex-direction: column; align-items: center; gap: 2px; }
nav button b { font-size: 20px; line-height: 1; }
nav button.on { color: var(--accent); }
.badge { background: var(--accent); color: var(--accent-text); border-radius: 999px; font-size: 11px; padding: 0 6px; margin-left: 3px; }
.toast { position: fixed; left: 50%; bottom: 150px; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; opacity: 0; transition: .2s; pointer-events: none; z-index: 50; max-width: 90vw; text-align: center; }
.toast.show { opacity: .94; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <!-- ============ БЛЮДА ============ -->
  <section id="scr-plan">
    <div class="top"><h1>Что готовим?</h1><button class="gear" data-a="settings" aria-label="Настройки">⚙️</button></div>
    <p class="sub">Напишите блюда — список соберётся сам и разложится по отделам.</p>
    <div class="card">
      <div class="search">
        <input class="field" id="q" placeholder="плов с курицей на 6, оливье…" autocomplete="off" enterkeyhint="done">
        <button class="go" data-a="submitQ" aria-label="Добавить">+</button>
        <div class="drop" id="drop" hidden></div>
      </div>
      <div class="row" style="margin-top:12px"><span>Сколько человек</span>
        <span class="stepper"><button data-a="people" data-x="-1">−</button><span id="people"></span><button data-a="people" data-x="1">+</button></span></div>
    </div>
    <div class="card"><div class="row" style="margin-bottom:10px"><h2 class="h2" style="margin:0">Меню</h2><button class="ghost" data-a="share" id="share-menu" hidden>Отправить ↗</button></div><div id="menu"></div></div>
    <div class="card"><h2 id="pop-title">Часто готовят</h2><div class="chips" id="popular"></div></div>
    <div class="card"><h2>По мелочи</h2><div class="chips" id="house"></div><p class="note" id="house-note"></p></div>
  </section>

  <!-- ============ СПИСОК ============ -->
  <section id="scr-list" hidden>
    <div class="top"><h1>Список</h1><span><button class="ghost" data-a="share">Отправить ↗</button> <button class="gear" data-a="settings" aria-label="Настройки">⚙️</button></span></div>
    <div id="sum"></div>
    <div class="progress"><i id="bar"></i></div>
    <div class="ad" id="ad-top"></div>
    <div id="sections"></div>
    <div class="card cart" id="cart-card" hidden><details id="cart"><summary><span>🧺 В корзине</span><span id="cart-n" class="muted"></span></summary><div id="cart-items" style="margin-top:6px"></div></details></div>
    <div class="card" id="home-card" hidden><h2>Проверьте дома</h2><div id="home"></div></div>
    <div class="card" id="sug-card" hidden><h2>Может пригодиться</h2><div class="chips" id="sug"></div></div>
    <div class="card"><h2>Добавить своё</h2>
      <div class="add"><input class="field" id="own" placeholder="например, корм коту"><button data-a="own">+</button></div></div>
    <div class="ad" id="ad-bottom"></div>
    <div class="row" style="margin:6px 2px 14px"><button class="ghost" data-a="finish">Завершить покупки</button><button class="ghost danger" data-a="reset">Очистить список</button></div>
  </section>

  <!-- ============ РЕЦЕПТЫ ============ -->
  <section id="scr-recipes" hidden>
    <div class="top"><h1>Рецепты</h1><button class="gear" data-a="settings" aria-label="Настройки">⚙️</button></div>
    <p class="sub" id="rec-sub"></p>
    <div class="card"><input class="field" id="rq" placeholder="Найти блюдо…" autocomplete="off"></div>
    <div class="card"><div class="row"><h2 class="h2" style="margin:0">Мои рецепты</h2><button class="ghost" data-a="newRecipe">+ Создать</button></div>
      <div class="rlist" id="my-recipes" style="margin-top:6px"></div></div>
    <div class="card rlist" id="all-recipes"></div>
  </section>

  <!-- ============ ИСТОРИЯ ============ -->
  <section id="scr-history" hidden>
    <div class="top"><h1>История</h1><button class="gear" data-a="settings" aria-label="Настройки">⚙️</button></div>
    <p class="sub" id="hist-sub"></p>
    <div class="card" id="freq-card" hidden><h2>Часто покупаете</h2><div class="chips" id="freq"></div></div>
    <div id="trips"></div>
  </section>
</div>

<div class="cta" id="cta" hidden><button class="primary" id="cta-btn"></button></div>
<nav>
  <button data-a="tab" data-x="plan" id="tab-plan" class="on"><b>🍲</b>Блюда</button>
  <button data-a="tab" data-x="list" id="tab-list"><b>🛒</b><span>Список<span class="badge" id="badge" hidden></span></span></button>
  <button data-a="tab" data-x="recipes" id="tab-recipes"><b>📖</b>Рецепты</button>
  <button data-a="tab" data-x="history" id="tab-history"><b>🕘</b>История</button>
</nav>
<div class="sheet" id="sheet" hidden><div class="panel" id="panel"></div></div>
<div class="sheet center" id="mini" hidden><div class="panel" id="mini-panel"></div></div>
<div class="onb" id="onb" hidden></div>
<datalist id="plist"></datalist>
<input type="file" id="photo-in" accept="image/*" hidden>
<div class="toast" id="toast"></div>

<script>
/* ===================== НАСТРОЙКИ РЕКЛАМЫ =====================
   adsgramBlockId  — блок Adsgram (adsgram.ai), только внутри Telegram
   yandexBlockId   — блок РСЯ (partner.yandex.ru), когда открыто как сайт
   partner         — своя прямая реклама. В РФ нужна маркировка: erid + рекламодатель
   interstitialEvery — полноэкранная Adsgram на каждую N-ю сборку списка (0 — выкл.)
   ownerContact    — куда писать желающим купить рекламу (видно, пока слот пуст) */
/* ===================== ССЫЛКИ «ОТПРАВИТЬ СПИСОК» =====================
   Заполните, когда зарегистрируете мини-приложение в @BotFather (/newapp):
   ссылка получится t.me/<botUsername>/<appName>?startapp=… и откроется прямо в Telegram.
   Пусто — отправляется ссылка на сайт приложения, тоже работает. */
const APP = { botUsername: "", appName: "" };

const ADS = {
  adsgramBlockId: "",
  yandexBlockId: "",
  partner: null, // { text: "…", url: "https://…", advertiser: "ООО …", erid: "…" }
  interstitialEvery: 3,
  ownerContact: "",
};

const tg = window.Telegram && Telegram.WebApp && Telegram.WebApp.initData ? Telegram.WebApp : null;
if (tg) { document.documentElement.classList.add("tg"); tg.ready(); tg.expand(); }
const haptic = () => { try { tg && tg.HapticFeedback.selectionChanged(); } catch (e) {} };

/* ===================== ДАННЫЕ ===================== */
const DB = window.DB;
const CATS = DB.categories;
const GROUP_ICON = {"Супы":"🍲","Горячее из мяса и птицы":"🍖","Рыба и морепродукты":"🐟","Гарниры и овощи":"🥔","Паста, пицца, выпечка с начинкой":"🍝","Салаты и закуски":"🥗","Завтраки":"🍳","Десерты и выпечка":"🍰","Напитки":"🥤","Мои рецепты":"⭐","Добавлено ИИ":"✨"};
const POPULAR = ["Борщ","Плов","Оливье","Шашлык","Блины","Котлеты","Картофельное пюре","Паста болоньезе","Цезарь","Курица в духовке","Селёдка под шубой","Пельмени","Сырники","Голубцы","Пицца","Шарлотка","Овощное рагу","Греческий салат"];
const FISH_POPULAR = ["Сёмга в духовке","Уха","Роллы","Рыба с овощами","Креветки в чесночном соусе","Поке"];

/* ===================== СОСТОЯНИЕ ===================== */
const KEY = "shoplist.v1";
const blank = () => ({

const dish = name => DB.dishes[name] || (S.custom[name] && [S.custom[name].servings, S.custom[name].items, [], "Мои рецепты", [], S.custom[name].time || "", S.custom[name].steps || []]) || null;
const product = pid => DB.products[pid] || [S.customProducts[pid] || "шт", 0, "", 0, CATS.length - 1, 0, ""];
const dishItems = (d, v) => d[4].length ? [[d[4][Math.min(v || 0, d[4].length - 1)][1], d[4][Math.min(v || 0, d[4].length - 1)][2]], ...d[1]] : d[1];
const dishTitle = (name, v) => { const d = dish(name); return d && d[4].length && v ? `${name} (${d[4][v][0]})` : name; };

/* ===================== ПОИСК И РАЗБОР ТЕКСТА (та же логика, что в боте) ===================== */
function norm(s) { return s.toLowerCase().replace(/ё/g, "е").replace(/[^\p{L}\p{N}\s-]/gu, " ").replace(/\s+/g, " ").trim(); }
function lev(a, b) {
  const m = a.length, n = b.length; if (!m || !n) return Math.max(m, n);
  let prev = Array.from({length: n + 1}, (_, i) => i);
  for (let i = 1; i <= m; i++) {
    const cur = [i];
    for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j-1] + 1, prev[j-1] + (a[i-1] === b[j-1] ? 0 : 1));
    prev = cur;
  }
  return prev[n];
}
function fuzzy(query, table, cutoff) {
  const q = norm(query); if (!q) return null;
  if (table[q]) return table[q];
  for (const cut of [1, 2]) {
    const stem = q.slice(0, -cut);
    if (stem.length < 4 && !(cut === 1 && q.length === 4)) continue;
    const hits = Object.keys(table).filter(k => k.startsWith(stem) && Math.abs(k.length - q.length) <= 3);
    if (hits.length === 1) return table[hits[0]];
  }
  let best = null, score = 0;
  for (const k of Object.keys(table)) {
    if (Math.abs(k.length - q.length) > 4) continue;
    const r = 1 - lev(q, k) / Math.max(q.length, k.length);
    if (r > score) { score = r; best = k; }
  }
  return score >= cutoff ? table[best] : null;
}
function findDish(q) {
  const hit = fuzzy(q, DB.dishAlias, 0.82); if (hit) return hit;
  const w = norm(q).split(" ");
  for (let n = w.length - 1; n > 0; n--) { const h = fuzzy(w.slice(0, n).join(" "), DB.dishAlias, 0.9); if (h) return h; }
  for (let n = 1; n < w.length; n++) { const h = fuzzy(w.slice(n).join(" "), DB.dishAlias, 0.9); if (h) return h; }
  return null;
}
const findProduct = q => fuzzy(q, DB.productAlias, 0.85);
function detectVariant(name, text) {
  const d = dish(name); if (!d || !d[4].length) return 0;
  const words = new Set(norm(text).split(" ").filter(w => w.length >= 4).map(w => w.slice(0, 4)));
  for (let i = 1; i < d[4].length; i++) {
    const [label, pid] = d[4][i];
    const keys = [norm(label).slice(0, 4), ...norm(pid).split(" ").filter(w => w.length >= 4).map(w => w.slice(0, 4))];
    if (keys.some(k => words.has(k))) return i;
  }
  return 0;
}
function searchDishes(q, limit = 7) {
  q = norm(q); if (q.length < 2) return [];
  const out = [];
  for (const [alias, name] of Object.entries(DB.dishAlias)) {
    if ((alias.startsWith(q) || alias.includes(" " + q) || (q.length > 3 && alias.includes(q))) && !out.includes(name) && dish(name)) out.push(name);
  }
  return out.sort((a, b) => norm(b).startsWith(q) - norm(a).startsWith(q)).slice(0, limit);
}
const WORD_NUMS = {"одного":1,"одну":1,"двоих":2,"двое":2,"двух":2,"троих":3,"трое":3,"трех":3,"трёх":3,"четверых":4,"четверо":4,"четырех":4,"пятерых":5,"пятеро":5,"шестерых":6,"шестеро":6,"семерых":7,"семеро":7,"восьмерых":8,"девятерых":9,"десятерых":10,"десять":10,"дюжину":12};
const NUM_RE = /(?:(?:^|\s)на\s+)?(\d+)\s*(?:человек\S*|чел\.?|порц\S*|персон\S*|гост\S*|шт\.?|штук\S*)?/i;
function parseRequest(text, def) {
  text = text.replace(/[А-Яа-яЁё]+/g, w => WORD_NUMS[w.toLowerCase()] ?? w);
  const parts = [];
  for (let ch of text.split(/[,;\n+]|\s+и\s+|\s+ещё\s+|\s+еще\s+/)) {
    ch = ch.trim().replace(/^[\s.\-—:]+|[\s.\-—:]+$/g, ""); if (!ch) continue;
    const m = ch.match(NUM_RE); const n = m ? +m[1] : null;
    let name = m ? ch.replace(NUM_RE, " ") : ch;
    name = norm(name.replace(/(^|\s)(хочу|приготовить|сделать|готовлю|буду|купить|нужно|надо|на)(?=\s|$)/gi, " "));
    if (!name) { if (n && parts.length && parts[parts.length - 1].n == null) parts[parts.length - 1].n = n; continue; }
    const halves = name.split(/\s+со?\s+/);
    const exact = fuzzy(name, DB.dishAlias, 0.82);
    const combo = !exact && halves.length > 1 ? halves.map(findDish) : [];
    if (combo.length && combo.every(Boolean)) { combo.forEach((d, i) => parts.push({kind: "dish", val: [d, detectVariant(d, halves[i])], n})); continue; }
    const d = exact || findDish(name);
    if (d) parts.push({kind: "dish", val: [d, detectVariant(d, name)], n});
    else { const p = findProduct(name); parts.push(p ? {kind: "product", val: p, n} : {kind: "unknown", val: name, n}); }
  }
  const res = {dishes: [], products: [], unknown: []};
  let prev = null;
  parts.forEach((p, i) => {
    if (p.kind === "product") { res.products.push([p.val, p.n || 1]); return; }
    const after = parts.slice(i + 1).find(x => x.kind !== "product" && x.n);
    const guess = p.n || (after && after.n) || prev || def;
    prev = p.n || prev;
    if (p.kind === "dish") res.dishes.push([p.val[0], guess, p.val[1], p.val[1] > 0]);
    else res.unknown.push([p.val, guess]);
  });
  return res;
}

/* ===================== ПРЕДПОЧТЕНИЯ ===================== */
function forbidden() { return S.prefs.diets.map(k => (DB.diets[k] || ["", ""])[1]).join(""); }
function isBad(pid, f = forbidden()) { if (!f) return false; const t = product(pid)[6] || ""; for (const c of t) if (f.includes(c)) return true; return false; }
/* подходит ли блюдо: {ok, v — лучший вариант, bad — что мешает} */
function fit(name, f = forbidden()) {
  const d = dish(name); if (!d || !f) return {ok: true, v: 0, bad: []};
  const bad = d[1].filter(([p]) => isBad(p, f)).map(([p]) => p);
  let v = 0;
  if (d[4].length) { const i = d[4].findIndex(x => !isBad(x[1], f)); if (i < 0) bad.unshift(d[4][0][1]); else v = i; }
  return {ok: !bad.length, v, bad};
}

/* ===================== ЦЕНЫ И КОЛИЧЕСТВА ===================== */
const FORMS = {"пучок":["пучок","пучка","пучков"],"зуб":["зубчик","зубчика","зубчиков"],"пакет":["пакет","пакета","пакетов"],"банка":["банка","банки","банок"],"бутылка":["бутылка","бутылки","бутылок"],"пачка":["пачка","пачки","пачек"],"десяток":["десяток","десятка","десятков"],"головка":["головка","головки","головок"],"пакетик":["пакетик","пакетика","пакетиков"],"плитка":["плитка","плитки","плиток"],"сырок":["сырок","сырка","сырков"],"бутыль":["бутыль","бутыли","бутылей"],"порция":["порцию","порции","порций"]};
function plural(n, w) { const f = FORMS[w]; if (!f) return w; n = Math.abs(n) % 100; if (n > 10 && n < 20) return f[2]; return n % 10 === 1 ? f[0] : (n % 10 >= 2 && n % 10 <= 4) ? f[1] : f[2]; }
const fmtNum = x => (Math.round(x * 10) / 10).toString().replace(".", ",");
function fmtAmount(q, unit) {
  if (unit === "г") return q >= 1000 ? fmtNum(q / 1000) + " кг" : Math.round(q) + " г";
  if (unit === "мл") return q >= 1000 ? fmtNum(q / 1000) + " л" : Math.round(q) + " мл";
  const n = Math.ceil(q - 1e-9); return n + " " + plural(n, unit);
}
function fmtQty(line) {
  const [unit, pack, label] = product(line.pid);
  const parts = []; const q = line.qty;
  if (q > 0) {
    if (pack) {
      const n = Math.max(1, Math.ceil(q / pack - 0.05));
      parts.push(label === "десяток" || label === "головка" ? `${n} ${plural(n, label)} · нужно ${fmtAmount(q, unit)}` : `${n} ${plural(n, label)} по ${fmtAmount(pack, unit)} · нужно ${fmtAmount(q, unit)}`);
    } else if (unit === "г" || unit === "мл") parts.push((unit === "г" ? "≈ " : "") + fmtAmount(Math.ceil(q / 50) * 50, unit));
    else parts.push(fmtAmount(q, unit));
  }
  if (line.count) parts.push(q > 0 ? `+${line.count} шт` : `${line.count} шт`);
  return parts.join(", ");
}
const priceOf = pid => S.myPrices[pid] ?? product(pid)[5] ?? 0;
function lineCost(l) {
  const [unit, pack] = product(l.pid); const pr = priceOf(l.pid); if (!pr) return 0;
  let c = 0;
  if (l.qty > 0) {
    if (pack) c += Math.max(1, Math.ceil(l.qty / pack - 0.05)) * pr;
    else if (unit === "г" || unit === "мл") c += Math.ceil(l.qty / 50) * 50 / 1000 * pr;
    else c += Math.ceil(l.qty - 1e-9) * pr;
  }
  if (l.count) c += l.count * pr;
  return c;
}
const rub = x => (x >= 100 ? Math.round(x / 10) * 10 : Math.round(x)).toLocaleString("ru-RU") + " ₽";
function priceUnit(pid) {
  const [unit, pack, label] = product(pid);
  if (pack) return `за ${label === "уп." ? "упаковку" : label} ${label === "десяток" || label === "головка" ? "" : fmtAmount(pack, unit)}`.trim();
  if (unit === "г") return "за 1 кг"; if (unit === "мл") return "за 1 л";
  return unit === "пучок" ? "за пучок" : "за штуку";
}

/* ===================== СБОРКА СПИСКА ===================== */
function buildList(dishes = S.dishes, manual = S.manual, fromHome = S.fromHome) {
  const buy = {}, home = {}, suggest = [], f = forbidden();
  for (const [name, servings, v] of dishes) {
    const d = dish(name); if (!d) continue;
    const k = servings / d[0];
    for (const [pid, q] of dishItems(d, v)) {
      const t = product(pid)[3] && !fromHome.includes(pid) ? home : buy;
      t[pid] ??= {pid, qty: 0, count: 0, dishes: []};
      t[pid].qty += q * k;
      if (!t[pid].dishes.includes(name)) t[pid].dishes.push(name);
    }
  }
  for (const [pid, cnt] of Object.entries(manual)) {
    buy[pid] ??= {pid, qty: 0, count: 0, dishes: []};
    buy[pid].count += cnt; delete home[pid];
  }
  const seen = new Set([...Object.keys(buy), ...Object.keys(home)]);
  for (const [name] of dishes) for (const pid of (dish(name) || [])[2] || []) {
    if (!seen.has(pid) && !isBad(pid, f)) { suggest.push(pid); seen.add(pid); }
  }
  const total = Object.values(buy).reduce((s, l) => s + lineCost(l), 0);
  return {buy, home, suggest, total};
}

const cap = s => s ? s[0].toUpperCase() + s.slice(1) : s;

    <span class="box">${done ? "✓" : ""}</span>

    ${l.dishes.length ? `<div class="for">${esc(l.dishes.join(", "))}</div>` : ""}</span></button>${price}</div>`;
}

function saveEditor() {
  const E = sheet, name = E.name.trim().replace(/\s+/g, " ");
  if (!name) return toast("Напишите название");
  if (DB.dishes[name]) return toast("Такое блюдо уже есть в базе — назовите чуть иначе");
  if (S.custom[name] && E.orig !== name) return toast("Рецепт с таким названием уже есть");
  const items = [];
  for (const r of E.rows) {
    const raw = r.name.trim(); if (!raw) continue;
    let pid = findExact(raw) || findProduct(raw);
    if (!pid) { pid = raw.toLowerCase(); S.customProducts[pid] = r.unit || "шт"; }
    items.push([pid, parseFloat(String(r.qty).replace(",", ".")) || 0]);
  }
  if (!items.length) return toast("Добавьте хотя бы один продукт");
  if (E.orig && E.orig !== name) {
    delete S.custom[E.orig];
    S.dishes.forEach(d => { if (d[0] === E.orig) d[0] = name; });
  }
  S.custom[name] = {servings: E.servings, time: E.time.trim(), items, steps: E.steps.split("\n").map(s => s.trim()).filter(Boolean), photo: E.photo};
  registerCustom();
  if (!save()) { S.custom[name].photo = ""; save(); }
  toast("Рецепт сохранён");
  openSheet({kind: "recipe", name, n: S.people, v: 0});
}
function pickPhoto(file) {
  const r = new FileReader();
  r.onload = () => {
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, 640 / Math.max(img.width, img.height));
      const c = document.createElement("canvas"); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      if (sheet && sheet.kind === "editor") { sheet.photo = c.toDataURL("image/jpeg", 0.72); renderSheet(); }
    };
    img.src = r.result;
  };
  r.readAsDataURL(file);
}

/* ===================== ОБЛАЧНАЯ КОПИЯ (Telegram CloudStorage) =====================
   Свои рецепты (без фото), история и настройки — чтобы не пропали при смене телефона. */
const cloud = tg && tg.CloudStorage && tg.isVersionAtLeast && tg.isVersionAtLeast("6.9") ? tg.CloudStorage : null;
let cloudTimer = null;
function cloudSaveSoon() { if (!cloud) return; clearTimeout(cloudTimer); cloudTimer = setTimeout(cloudSave, 2500); }
function cloudSave() {
  try {
    const custom = {}; for (const [k, v] of Object.entries(S.custom)) custom[k] = {...v, photo: ""};
    const s = JSON.stringify({people: S.people, prefs: S.prefs, theme: S.theme, showPrices: S.showPrices, order: S.order, myPrices: S.myPrices,
      custom, customProducts: S.customProducts, trips: S.trips.slice(0, 15), history: S.history, onboarded: S.onboarded});
    const n = Math.ceil(s.length / 3800);
    for (let i = 0; i < n; i++) cloud.setItem("b" + i, s.slice(i * 3800, (i + 1) * 3800));
    cloud.setItem("bn", String(n));
  } catch (e) {}
}
function cloudRestore() {
  if (!cloud) return;
  cloud.getItem("bn", (err, v) => {
    const n = +v; if (err || !n) return;
    cloud.getItems(Array.from({length: n}, (_, i) => "b" + i), (err2, vals) => {
      if (err2) return;
      try {
        const d = JSON.parse(Array.from({length: n}, (_, i) => vals["b" + i] || "").join(""));
        Object.assign(S, d); registerCustom(); applyTheme(); $("onb").hidden = true; save(); render(); toast("Настройки и рецепты восстановлены");
      } catch (e) {}
    });
  });
}

  const r = parseRequest(text, S.people), f = forbidden();
  const miss = [];
  for (const [d, n, v, explicit] of r.dishes) {
    const vv = explicit ? v : fit(d, f).v;  // сказал «с бараниной» — так и будет, иначе — по питанию
    const ex = S.dishes.find(x => x[0] === d);
    ex ? (ex[1] = n, ex[2] = vv) : S.dishes.push([d, n, vv]);
  }
  for (const [pid, n] of r.products) S.manual[pid] = (S.manual[pid] || 0) + n;
  for (const [name] of r.unknown) {
    const opts = searchDishes(name);
    if (opts.length) miss.push(`«${name}» — может, ${opts.slice(0, 3).join(", ")}?`);
    else S.manual[name] = (S.manual[name] || 0) + 1;
  }
  if (miss.length) toast(miss[0]);
  render();
  return r;
}
function finishTrip() {
  const {buy} = buildList(), lines = Object.values(buy);
  if (!lines.length) return;
  const bought = lines.some(l => S.checked[l.pid]) ? lines.filter(l => S.checked[l.pid]) : lines;
  const now = Date.now();
  for (const l of bought) S.history[l.pid] = now;
  S.trips.unshift({t: now, dishes: S.dishes.map(d => [...d]), manual: {...S.manual},
    items: bought.map(l => [l.pid, fmtQty(l).replace(/ · нужно.*$/, ""), Math.round(lineCost(l))]),
    total: Math.round(bought.reduce((s, l) => s + lineCost(l), 0))});
  S.trips = S.trips.slice(0, 60);
  Object.assign(S, {dishes: [], manual: {}, fromHome: [], checked: {}});
  showTab("history"); toast("Сохранено в историю 👍");
}
function showTab(t) {
  tab = t;
  for (const k of ["plan", "list", "recipes", "history"]) { $("scr-" + k).hidden = k !== t; $("tab-" + k).classList.toggle("on", k === t); }
  keepAwake(t === "list");
  window.scrollTo(0, 0); render();
}
function refreshOpen() { if (!$("onb").hidden) renderOnb(); else renderSheet(); }

const ACT = {
  tab: el => showTab(el.dataset.x),
  settings: () => openSheet({kind: "settings"}),
  closeSheet, closeMini,
  submitQ: () => { const q = $("q"); if (!q.value.trim()) return; addText(q.value); q.value = ""; $("drop").hidden = true; q.blur(); },
  pick: el => { const q = $("q"); const parts = q.value.split(/[,;]/); parts.pop(); addText(el.dataset.x); q.value = parts.length ? parts.join(",") + ", " : ""; $("drop").hidden = true; },
  people: el => { S.people = Math.max(1, Math.min(30, S.people + +el.dataset.x)); render(); refreshOpen(); },
  serv: el => { const x = S.dishes[+el.dataset.x]; x[1] = Math.max(1, Math.min(100, x[1] + +el.dataset.y)); render(); },
  variant: el => { S.dishes[+el.dataset.x][2] = +el.dataset.y; haptic(); render(); },
  rmDish: el => { S.dishes.splice(+el.dataset.x, 1); render(); },
  pop: el => { const i = S.dishes.findIndex(x => x[0] === el.dataset.x); i >= 0 ? S.dishes.splice(i, 1) : S.dishes.push([el.dataset.x, S.people, fit(el.dataset.x).v]); haptic(); render(); },
  house: el => { const p = el.dataset.x; S.manual[p] ? delete S.manual[p] : (S.manual[p] = 1); haptic(); render(); },
  check: el => { const p = el.dataset.x; S.checked[p] = !S.checked[p]; if (S.checked[p]) S.history[p] = Date.now(); haptic(); render(); },
  nohome: el => { S.fromHome.push(el.dataset.x); render(); },
  sug: el => { S.manual[el.dataset.x] = (S.manual[el.dataset.x] || 0) + 1; render(); },
  own: () => { const v = $("own").value.trim(); if (!v) return; addText(v); $("own").value = ""; },
  build: () => { S.builds++; showTab("list"); maybeInterstitial(); },
  finish: () => { const {buy} = buildList(); if (!Object.keys(buy).length) return; const any = Object.keys(buy).some(p => S.checked[p]);
    confirmBox(any ? "Сохранить купленное в историю и начать новый список?" : "Ничего не отмечено. Сохранить весь список в историю?", finishTrip); },
  reset: () => confirmBox("Очистить список без сохранения?", () => { Object.assign(S, {dishes: [], manual: {}, fromHome: [], checked: {}}); showTab("plan"); }),
  share: () => { if (!S.dishes.length && !Object.keys(S.manual).length) return toast("Список пуст"); openSheet({kind: "share"}); },
  sendTg: () => { const {link, msg} = shareData(); const url = "https://t.me/share/url?url=" + encodeURIComponent(link) + "&text=" + encodeURIComponent(msg);
    tg ? tg.openTelegramLink(url) : window.open(url, "_blank"); },
  sendAny: () => { const {link, msg} = shareData(); navigator.share ? navigator.share({text: msg + "\n" + link}).catch(() => {}) : ACT.copyLink(); },
  copyLink: () => { const {link, msg} = shareData(); copy(msg + "\n" + link, "Скопировано — вставьте в любой мессенджер"); },
  copyText: () => copy(listText(), "Список скопирован текстом"),
  price: el => openPrice(el.dataset.x),
  priceSave: el => { const v = parseFloat($("price-in").value.replace(",", ".")); if (v > 0) S.myPrices[el.dataset.x] = v; else delete S.myPrices[el.dataset.x]; closeMini(); render(); },
  priceReset: el => { delete S.myPrices[el.dataset.x]; closeMini(); render(); },
  recipe: el => { const name = el.dataset.x, i = S.dishes.findIndex(x => x[0] === name);
    openSheet({kind: "recipe", name, n: i >= 0 ? S.dishes[i][1] : S.people, v: i >= 0 ? S.dishes[i][2] : fit(name).v}); },
  rVariant: el => { sheet.v = +el.dataset.x; renderSheet(); },
  rServ: el => { sheet.n = Math.max(1, Math.min(100, sheet.n + +el.dataset.x)); renderSheet(); },
  rAdd: () => { const i = S.dishes.findIndex(x => x[0] === sheet.name);
    i >= 0 ? (S.dishes[i][1] = sheet.n, S.dishes[i][2] = sheet.v) : S.dishes.push([sheet.name, sheet.n, sheet.v]);
    haptic(); toast(`${dishTitle(sheet.name, sheet.v)} — в меню`); closeSheet(); },
  forkRecipe: () => openEditor(sheet.name, true),
  editRecipe: () => openEditor(sheet.name, false),
  delRecipe: () => { const name = sheet.name; confirmBox(`Удалить «${name}»?`, () => { delete S.custom[name]; S.dishes = S.dishes.filter(d => d[0] !== name); closeSheet(); }); },
  newRecipe: () => openEditor(null, false),
  eServ: el => { sheet.servings = Math.max(1, Math.min(50, sheet.servings + +el.dataset.x)); renderSheet(); },
  eAddRow: () => { sheet.rows.push({name: "", qty: "", unit: "г"}); renderSheet(); const ins = $("panel").querySelectorAll('[data-e="rname"]'); ins[ins.length - 1].focus(); },
  eRmRow: el => { sheet.rows.splice(+el.dataset.x, 1); renderSheet(); },
  eSave: () => saveEditor(),
  pickPhoto: () => $("photo-in").click(),
  rmPhoto: () => { sheet.photo = ""; renderSheet(); },
  diet: el => { const k = el.dataset.x, d = S.prefs.diets; d.includes(k) ? d.splice(d.indexOf(k), 1) : d.push(k);
    S.dishes.forEach(x => { const dd = dish(x[0]); if (dd && dd[4].length && isBad(dd[4][x[2]][1])) x[2] = fit(x[0]).v; });
    haptic(); refreshOpen(); render(); },
  fish: () => { S.prefs.fish = !S.prefs.fish; refreshOpen(); render(); },
  theme: el => { S.theme = el.dataset.x; applyTheme(); refreshOpen(); save(); },
  togglePrices: () => { S.showPrices = !S.showPrices; refreshOpen(); render(); },
  resetPrices: () => confirmBox("Вернуть средние цены везде?", () => { S.myPrices = {}; renderSheet(); render(); }),
  up: el => { const i = +el.dataset.x; if (i > 0) { [S.order[i], S.order[i - 1]] = [S.order[i - 1], S.order[i]]; renderSheet(); save(); } },
  down: el => { const i = +el.dataset.x; if (i < S.order.length - 1) { [S.order[i], S.order[i + 1]] = [S.order[i + 1], S.order[i]]; renderSheet(); save(); } },
  clearHistory: () => confirmBox("Удалить всю историю покупок?", () => { S.trips = []; renderSheet(); render(); }),
  onboard: () => { closeSheet(); showOnb(); },
  onbNext: () => { if (onbStep < 2) { onbStep++; renderOnb(); } else finishOnb(); },
  onbBack: () => { onbStep = Math.max(0, onbStep - 1); renderOnb(); },
  onbSkip: () => finishOnb(),
  repeat: el => { const t = S.trips[+el.dataset.x];
    const go = () => { S.dishes = t.dishes.map(d => [...d]); S.manual = {...(t.manual || Object.fromEntries(t.items.map(([p]) => [p, 1])))}; S.checked = {}; S.fromHome = []; showTab("list"); toast("Список восстановлен"); };
    S.dishes.length || Object.keys(S.manual).length ? confirmBox("Заменить текущий список этим?", go) : go(); },
  rmTrip: el => confirmBox("Удалить эту запись?", () => { S.trips.splice(+el.dataset.x, 1); render(); }),
};

document.addEventListener("click", e => {
  const el = e.target.closest("[data-a]");
  if (!el) { if (!e.target.closest(".search")) $("drop").hidden = true; if (e.target === $("sheet")) closeSheet(); if (e.target === $("mini")) closeMini(); return; }
  const fn = ACT[el.dataset.a]; if (fn) fn(el);
});
// поля редактора — без перерисовки, чтобы не терять фокус
document.addEventListener("input", e => {
  const k = e.target.dataset.e;
  if (k && sheet && sheet.kind === "editor") {
    const i = +e.target.dataset.i;
    if (k === "rname") sheet.rows[i].name = e.target.value;
    else if (k === "rqty") sheet.rows[i].qty = e.target.value;
    else if (k === "runit") sheet.rows[i].unit = e.target.value;
    else sheet[k] = e.target.value;
  }
  if (e.target.id === "rq") renderRecipes();
});
document.addEventListener("change", e => {
  if (e.target.dataset.e === "rname" && sheet && sheet.kind === "editor") renderSheet();  // подтянуть единицу из каталога
});
$("photo-in").addEventListener("change", e => { const f = e.target.files[0]; if (f && sheet) pickPhoto(f); e.target.value = ""; });
const q = $("q"), drop = $("drop");
q.addEventListener("input", () => {
  const last = q.value.split(/[,;]/).pop().replace(/\d+|(^|\s)на(\s|$)/g, " ").trim();
  const opts = last ? searchDishes(last) : [];
  drop.hidden = !opts.length;
  drop.innerHTML = opts.map(d => `<button data-a="pick" data-x="${esc(d)}">${thumb(d)}<span>${esc(d)}<br><small class="muted">${esc(dish(d)[3])}</small></span></button>`).join("");
});
q.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); ACT.submitQ(); } });
$("own").addEventListener("keydown", e => { if (e.key === "Enter") ACT.own(); });
document.addEventListener("keydown", e => { if (e.target.id === "price-in" && e.key === "Enter") document.querySelector('[data-a="priceSave"]').click(); });

function render() {
  if (tab === "plan") renderPlan();
  renderList();  // бейдж на вкладке нужен всегда
  if (tab === "recipes") renderRecipes();
  if (tab === "history") renderHistory();
  save(); updateMain();
}

/* ===================== РЕКЛАМА ===================== */
function loadScript(src) { return new Promise((ok, fail) => { const s = document.createElement("script"); s.src = src; s.async = true; s.onload = ok; s.onerror = fail; document.head.appendChild(s); }); }
function renderAds() {
  const top = $("ad-top"), bottom = $("ad-bottom");
  if (ADS.partner && ADS.partner.text) {
    const p = ADS.partner;
    top.innerHTML = `<div class="lbl">Реклама${p.advertiser ? " · " + esc(p.advertiser) : ""}${p.erid ? " · erid: " + esc(p.erid) : ""}</div>` +
      (p.url ? `<a href="${esc(p.url)}" target="_blank" rel="noopener sponsored">${esc(p.text)}</a>` : esc(p.text));
  } else if (ADS.ownerContact) top.innerHTML = `<div class="lbl">Место для рекламы</div>Ваш магазин или доставка здесь — пишите ${esc(ADS.ownerContact)}`;
  if (ADS.yandexBlockId && !tg) {
    bottom.innerHTML = `<div id="yandex_rtb_${esc(ADS.yandexBlockId)}"></div>`;
    window.yaContextCb = window.yaContextCb || [];
    window.yaContextCb.push(() => Ya.Context.AdvManager.render({blockId: ADS.yandexBlockId, renderTo: "yandex_rtb_" + ADS.yandexBlockId}));
    loadScript("https://yandex.ru/ads/system/context.js").catch(() => {});
  }
}
let adsgram = null;
async function maybeInterstitial() {
  if (!tg || !ADS.adsgramBlockId || !ADS.interstitialEvery || S.builds % ADS.interstitialEvery) return;
  try {
    if (!window.Adsgram) await loadScript("https://sad.adsgram.ai/js/sad.min.js");
    adsgram ??= window.Adsgram.init({blockId: ADS.adsgramBlockId});
    await adsgram.show();
  } catch (e) { /* реклама не загрузилась — не мешаем */ }
}

/* ===================== ОТПРАВИТЬ СПИСОК ДРУГОМУ =====================
   Весь список (блюда с вариантами, порции, мелочи, свои рецепты) упаковывается в ссылку.
   Блюда и продукты кодируются постоянными номерами из data/ids.json. */
const DISH_BY_ID = {}, PROD_BY_ID = {};
for (const [n, d] of Object.entries(DB.dishes)) DISH_BY_ID[d[7]] = n;
for (const [n, p] of Object.entries(DB.products)) PROD_BY_ID[p[7]] = n;
const b64u = str => btoa(String.fromCharCode(...new TextEncoder().encode(str))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
const unb64u = code => new TextDecoder().decode(Uint8Array.from(atob(code.replace(/-/g, "+").replace(/_/g, "/")), c => c.charCodeAt(0)));
const pkey = pid => DB.products[pid] ? DB.products[pid][7] : pid;  // номер из каталога или своё название
function packList(withSteps = true) {
  const c = {};
  for (const [name] of S.dishes) if (S.custom[name]) {
    const r = S.custom[name];
    c[name] = [r.servings, r.items.map(([p, q]) => DB.products[p] ? [pkey(p), q] : [p, q, S.customProducts[p] || "шт"]), r.time || "", withSteps ? r.steps || [] : []];
  }
  const o = {d: S.dishes.map(([name, n, v]) => [DB.dishes[name] ? DB.dishes[name][7] : name, n, v]),
    m: Object.entries(S.manual).map(([p, n]) => [pkey(p), n]), h: S.fromHome.map(pkey)};
  if (Object.keys(c).length) o.c = c;
  return "L" + b64u(JSON.stringify(o));
}
function shareData() {
  let code = packList(true);
  let link;
  if (APP.botUsername) {
    if (code.length > 512) code = packList(false);  // лимит Telegram на startapp — без шагов своих рецептов
    if (code.length <= 512) link = `https://t.me/${APP.botUsername}${APP.appName ? "/" + APP.appName : ""}?startapp=${code}`;
  }
  link ??= location.origin + location.pathname + "?l=" + packList(true);
  const names = S.dishes.map(d => dishTitle(d[0], d[2]) + " на " + d[1]);
  const msg = "Сможешь купить продукты? По ссылке список уже разложен по отделам, купленное можно отмечать." +
    (names.length ? "\nГотовим: " + names.join(", ") + "." : "");
  return {link, msg};
}
function listText() {
  const {buy, total} = buildList(); const byCat = {};
  for (const l of Object.values(buy)) if (!S.checked[l.pid]) (byCat[product(l.pid)[4]] ??= []).push(l);
  let text = "Список покупок" + (S.showPrices && total ? ` (≈ ${rub(total)})` : "") + "\n";
  for (const ci of S.order) if (byCat[ci]) text += `\n${CATS[ci]}:\n` + byCat[ci].map(l => `— ${l.pid}${fmtQty(l) ? " (" + fmtQty(l).replace(/ · нужно.*$/, "") + ")" : ""}`).join("\n") + "\n";
  return text;
}
function copy(text, ok) {
  (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject()).then(() => toast(ok)).catch(() => {
    const t = document.createElement("textarea"); t.value = text; document.body.appendChild(t); t.select();
    try { document.execCommand("copy"); toast(ok); } catch (e) { toast("Не получилось скопировать"); } t.remove();
  });
}
function shareHtml() {
  const {buy, total} = buildList();
  const n = Object.keys(buy).length;
  return `<button class="close" data-a="closeSheet" aria-label="Закрыть">×</button><div class="in">
    <h1>Отправить список</h1>
    <p class="sub">Человек откроет ссылку — у него появится этот же список по отделам: ${n} поз.${S.showPrices && total ? `, ≈ ${rub(total)}` : ""}. Свои рецепты тоже передадутся.</p>
    <div class="card"><div class="h2">Что уйдёт</div><p style="margin:0;white-space:pre-line">${esc(shareData().msg)}</p><p class="note" style="margin-bottom:0">+ ссылка на список</p></div>
    <div class="btns">
      <button class="primary" data-a="sendTg">Отправить в Telegram</button>
      <button class="secondary" data-a="sendAny">${navigator.share ? "Другой мессенджер" : "Скопировать с ссылкой"}</button>
      <button class="ghost" data-a="copyText" style="padding:10px">Скопировать просто текстом</button>
    </div></div>`;
}
function importShared(code) {
  let o;
  try { o = JSON.parse(unb64u(code.slice(1))); } catch (e) { toast("Ссылка на список повреждена"); return; }
  const go = () => {
    for (const [name, [servings, items, time, steps]] of Object.entries(o.c || {})) {
      if (S.custom[name] || DB.dishes[name]) continue;
      S.custom[name] = {servings, time, steps, photo: "", items: items.map(([k, q, unit]) => {
        const pid = typeof k === "number" ? PROD_BY_ID[k] : k;
        if (typeof k !== "number") S.customProducts[pid] = unit || "шт";
        return [pid, q];
      }).filter(([pid]) => pid)};
    }
    registerCustom();
    const dishes = (o.d || []).map(([k, n, v]) => [typeof k === "number" ? DISH_BY_ID[k] : k, n, v || 0]).filter(([name]) => name && dish(name));
    const manual = {};
    for (const [k, n] of o.m || []) { const pid = typeof k === "number" ? PROD_BY_ID[k] : k; if (pid) manual[pid] = n; }
    const fromHome = (o.h || []).map(k => typeof k === "number" ? PROD_BY_ID[k] : k).filter(Boolean);
    Object.assign(S, {dishes, manual, fromHome, checked: {}, lastShare: code});
    showTab("list"); toast("Список получен — можно идти в магазин 🛒");
  };
  const busy = S.dishes.length || Object.keys(S.manual).length;
  if (busy) confirmBox("Вам прислали список покупок. Заменить им текущий?", go); else go();
}

/* ===================== СТАРТ ===================== */
registerCustom();
$("plist").innerHTML = Object.keys(DB.products).map(p => `<option value="${esc(p)}">`).join("");
applyTheme();
const incoming = new URLSearchParams(location.search).get("q");
if (incoming && incoming !== S.lastQ) {  // пришли из бота с готовым запросом
  Object.assign(S, {dishes: [], manual: {}, fromHome: [], checked: {}, lastQ: incoming});
  addText(incoming);
  tab = "list";
}
const params = new URLSearchParams(location.search);
const shared = (tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param) || params.get("tgWebAppStartParam") || params.get("l");
renderAds();
showTab(tab);
if (shared && shared[0] === "L" && shared !== S.lastShare) { S.onboarded = true; importShared(shared); }  // по ссылке — сразу к списку, без анкеты
else if (!S.onboarded) { showOnb(); if (!S.dishes.length) cloudRestore(); }
</script>
