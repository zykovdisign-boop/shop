<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Что купить</title>
<meta name="description" content="Список покупок, который собирается сам: блюда, продукты по отделам, примерная сумма, рецепты и ваш холодильник.">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="data.js?v=d358b4da"></script>
<style>
:root {
  --bg: var(--tg-theme-bg-color, #ffffff);
  --bg2: var(--tg-theme-secondary-bg-color, #f2f3ef);
  --text: var(--tg-theme-text-color, #1d1f1c);
  --hint: var(--tg-theme-hint-color, #8a8f86);
  --accent: var(--tg-theme-button-color, #2f9e55);
  --accent-text: var(--tg-theme-button-text-color, #ffffff);
  --link: var(--tg-theme-link-color, #2f9e55);
  --line: color-mix(in srgb, var(--text) 10%, transparent);
  --soft: color-mix(in srgb, var(--accent) 12%, transparent);
  --warn: #e0912a;
  --danger: #d9534f;
  --radius: 16px;
}
@media (prefers-color-scheme: dark) {
  html:not(.tg):not([data-theme]) { --bg: #171916; --bg2: #0f110e; --text: #eceee9; --hint: #8f968b; --accent: #43b86a; --link: #6fd08f; }
}
html[data-theme="light"] { --bg: #ffffff; --bg2: #f2f3ef; --text: #1d1f1c; --hint: #8a8f86; --accent: #2f9e55; --accent-text: #fff; --link: #2f9e55; }
html[data-theme="dark"] { --bg: #1b1d1a; --bg2: #111310; --text: #eceee9; --hint: #8f968b; --accent: #43b86a; --accent-text: #fff; --link: #6fd08f; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg2); color: var(--text);
  font: 16px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
body { padding-bottom: calc(150px + env(safe-area-inset-bottom)); }
body.lock { overflow: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
input, textarea, select { font: inherit; color: var(--text); }
img { display: block; }
.wrap { max-width: 560px; margin: 0 auto; padding: 10px 16px 24px; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
h1 { font-size: 26px; margin: 6px 0 2px; letter-spacing: -.02em; }
.icon-btn { width: 40px; height: 40px; border-radius: 12px; background: var(--bg); font-size: 18px; }
.sub { color: var(--hint); font-size: 14px; margin: 0 0 14px; }
.card { background: var(--bg); border-radius: var(--radius); padding: 14px; margin-bottom: 12px; }
.card > h2, .h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--hint); margin: 0 0 8px; font-weight: 600; }
.muted { color: var(--hint); }
.small { font-size: 13px; }
.row { display: flex; gap: 10px; align-items: center; justify-content: space-between; }
.note { font-size: 13px; color: var(--hint); margin: 8px 0 0; }
.primary { display: block; width: 100%; background: var(--accent); color: var(--accent-text); border-radius: 12px; padding: 14px; font-weight: 600; text-align: center; }
.secondary { display: block; width: 100%; background: var(--soft); color: var(--link); border-radius: 12px; padding: 12px; font-weight: 600; text-align: center; }
.ghost { color: var(--link); font-size: 15px; }
.danger { color: var(--danger); }
.field { width: 100%; border: 1.5px solid var(--line); background: var(--bg2); border-radius: 12px; padding: 11px 13px; outline: none; }
.field:focus { border-color: var(--accent); }
.stepper { display: inline-flex; align-items: center; background: var(--bg2); border-radius: 10px; flex: none; }
.stepper button { width: 34px; height: 32px; font-size: 20px; color: var(--accent); }
.stepper span { min-width: 24px; text-align: center; font-weight: 600; }
.stepper.big button { width: 56px; height: 56px; font-size: 28px; }
.stepper.big span { min-width: 60px; font-size: 32px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { background: var(--bg2); border-radius: 999px; padding: 7px 12px; font-size: 14px; }
.chip.on { background: var(--accent); color: var(--accent-text); }
.chip.old { box-shadow: inset 0 0 0 1.5px var(--warn); }
.chip.off { opacity: .45; text-decoration: line-through; }
.chip .x { opacity: .55; margin-left: 4px; }
.seg { display: flex; background: var(--bg2); border-radius: 12px; padding: 3px; gap: 3px; }
.seg button { flex: 1; padding: 8px 6px; border-radius: 9px; font-size: 15px; }
.seg button.on { background: var(--bg); box-shadow: 0 1px 3px rgba(0,0,0,.12); font-weight: 600; }
.warn { color: var(--warn); font-size: 13px; }
.switch { position: relative; width: 48px; height: 28px; background: var(--line); border-radius: 999px; flex: none; transition: .2s; }
.switch::after { content: ""; position: absolute; left: 3px; top: 3px; width: 22px; height: 22px; background: #fff; border-radius: 50%; transition: .2s; box-shadow: 0 1px 3px rgba(0,0,0,.25); }
.switch.on { background: var(--accent); }
.switch.on::after { left: 23px; }
.set-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.set-row:last-child { border-bottom: 0; }

/* строки блюд */
.thumb { width: 46px; height: 46px; border-radius: 12px; background: var(--bg2); flex: none; overflow: hidden; display: grid; place-items: center; font-size: 22px; }
.thumb.sm { width: 36px; height: 36px; border-radius: 10px; font-size: 18px; }
.thumb img { width: 100%; height: 100%; object-fit: cover; }
.drow { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.drow:last-child { border-bottom: 0; }
.drow .name { flex: 1; min-width: 0; text-align: left; }
.drow .name b { font-weight: 500; display: block; }
.drow .name small { color: var(--hint); font-size: 13px; }
.plus { flex: none; width: 36px; height: 36px; border-radius: 50%; background: var(--soft); color: var(--link); font-size: 22px; line-height: 36px; }
.plus.on { background: var(--accent); color: var(--accent-text); font-size: 16px; }
.rm { color: var(--hint); font-size: 22px; width: 28px; height: 32px; flex: none; }
details.grp { border-bottom: 1px solid var(--line); }
details.grp:last-child { border-bottom: 0; }
details.grp summary { list-style: none; padding: 12px 0; font-weight: 600; display: flex; justify-content: space-between; cursor: pointer; }
details.grp summary::-webkit-details-marker { display: none; }
details.grp summary::after { content: "›"; color: var(--hint); transform: rotate(90deg); transition: .2s; }
details.grp[open] summary::after { transform: rotate(-90deg); }

/* список */
.total { font-size: 28px; font-weight: 700; letter-spacing: -.02em; }
.progress { height: 6px; background: var(--bg); border-radius: 3px; overflow: hidden; margin: 8px 0 12px; }
.progress i { display: block; height: 100%; background: var(--accent); transition: width .25s; }
.sec h2 { display: flex; justify-content: space-between; }
.item { display: flex; gap: 12px; align-items: flex-start; padding: 10px 0; border-bottom: 1px solid var(--line); }
.item:last-child { border-bottom: 0; }
.item .tap { display: flex; gap: 12px; align-items: flex-start; flex: 1; min-width: 0; text-align: left; }
.box { flex: none; width: 26px; height: 26px; border-radius: 8px; border: 2px solid var(--line); display: grid; place-items: center; color: var(--accent-text); font-size: 15px; transition: .15s; }
.item.done .box { background: var(--accent); border-color: var(--accent); }
.item .t { flex: 1; min-width: 0; }
.item .q { opacity: .72; font-size: 14px; }
.item .n { text-align: left; }
.item .qbtn { font-size: 14px; color: var(--text); opacity: .75; text-align: left; border-bottom: 1px dashed var(--line); }
.item .qbtn.set { color: var(--link); opacity: 1; }
.item .qbtn.ask { color: var(--link); opacity: .9; font-size: 13px; }
.qty-in { font-size: 30px; font-weight: 700; text-align: center; width: 120px; border: 0; background: transparent; outline: none; }
.qty-row { display: flex; align-items: center; justify-content: center; gap: 12px; margin: 6px 0 12px; }
.qty-row .stepper button { width: 48px; height: 48px; font-size: 26px; }
.item .for { color: var(--hint); font-size: 12px; }
.item.done .n, .item.done .q { text-decoration: line-through; opacity: .5; }
.price { flex: none; font-size: 13px; color: var(--hint); padding: 3px 0 3px 6px; white-space: nowrap; }
.price.mine { color: var(--link); }
.fold summary { cursor: pointer; font-weight: 600; list-style: none; display: flex; justify-content: space-between; gap: 8px; }
.fold summary::-webkit-details-marker { display: none; }
.home-item { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--line); gap: 8px; }
.home-item:last-child { border-bottom: 0; }
.home-item button { color: var(--link); font-size: 14px; white-space: nowrap; }
.empty-state { text-align: center; padding: 48px 20px 24px; }
.empty-state .big { font-size: 56px; }
.empty-state p { color: var(--hint); max-width: 300px; margin: 8px auto 0; }
.order li { display: flex; justify-content: space-between; align-items: center; padding: 5px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
.order ol { margin: 0; padding-left: 20px; }
.order button { width: 34px; height: 30px; color: var(--accent); }
.trip summary { list-style: none; cursor: pointer; }
.trip summary::-webkit-details-marker { display: none; }
.trip .items { font-size: 14px; margin: 10px 0; opacity: .85; }
.trip .items div { padding: 3px 0; border-bottom: 1px dashed var(--line); display: flex; justify-content: space-between; gap: 8px; }

/* всплывающие окна */
.sheet { position: fixed; inset: 0; z-index: 30; background: rgba(0,0,0,.4); display: flex; align-items: flex-end; justify-content: center; }
.sheet .panel { background: var(--bg2); width: 100%; max-width: 560px; max-height: 92vh; overflow-y: auto; border-radius: 20px 20px 0 0; padding: 0 0 calc(24px + env(safe-area-inset-bottom)); animation: up .22s ease-out; }
.sheet.center { align-items: center; padding: 16px; }
.sheet.center .panel { border-radius: 20px; max-height: 80vh; }
.sheet.tall .panel { height: 92vh; }
@keyframes up { from { transform: translateY(40px); opacity: .5; } }
.panel .in { padding: 14px 16px 0; }
.panel .head { position: sticky; top: 0; z-index: 3; background: var(--bg2); padding: 12px 16px 10px; }
.grab { width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 10px; }
.close { position: sticky; top: 0; float: right; margin: 10px 10px 0 0; width: 34px; height: 34px; border-radius: 50%; background: var(--bg); font-size: 20px; z-index: 4; box-shadow: 0 1px 4px rgba(0,0,0,.15); }
.hero { width: 100%; aspect-ratio: 16/10; object-fit: cover; background: var(--bg); }
.hero-emoji { height: 110px; display: grid; place-items: center; font-size: 60px; background: var(--bg); }
.credit { font-size: 11px; color: var(--hint); padding: 4px 16px 0; }
.credit a { color: var(--hint); }
.ing { display: flex; justify-content: space-between; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
.ing:last-child { border-bottom: 0; }
.ing span:last-child { color: var(--hint); text-align: right; }
.ing .have { color: var(--link); }
.steps { margin: 0; padding-left: 22px; }
.steps li { padding: 6px 0; }
.steps li::marker { color: var(--accent); font-weight: 700; }
.btns { display: grid; gap: 8px; }
.erow { display: grid; grid-template-columns: 1fr 76px 64px 28px; gap: 6px; align-items: center; margin-bottom: 6px; }
.erow .field { padding: 9px 10px; }
.erow .u { font-size: 14px; color: var(--hint); text-align: center; }
.photo-pick { display: flex; gap: 12px; align-items: center; }
.photo-pick .thumb { width: 72px; height: 72px; }

/* первый запуск */
.onb { position: fixed; inset: 0; z-index: 40; background: var(--bg2); overflow-y: auto; }
.onb .wrap { min-height: 100%; display: flex; flex-direction: column; padding-top: 40px; }
.onb h1 { font-size: 28px; }
.onb .grow { flex: 1; }
.dots { display: flex; gap: 6px; justify-content: center; margin: 16px 0; }
.dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
.dots i.on { background: var(--accent); }

/* реклама */
.ad { background: var(--bg); border-radius: var(--radius); padding: 12px 14px; margin-bottom: 12px; font-size: 14px; }
.ad .lbl { font-size: 11px; color: var(--hint); text-transform: uppercase; letter-spacing: .05em; }
.ad a { color: var(--link); text-decoration: none; font-weight: 600; }
.ad:empty { display: none; }

/* кнопка + и нижняя панель */
.fab { position: fixed; right: max(16px, calc(50% - 264px)); bottom: calc(76px + env(safe-area-inset-bottom)); width: 60px; height: 60px; border-radius: 50%;
  background: var(--accent); color: var(--accent-text); font-size: 34px; line-height: 60px; z-index: 11; box-shadow: 0 8px 22px rgba(0,0,0,.25); }
.cta { position: fixed; left: 16px; right: 92px; bottom: calc(76px + env(safe-area-inset-bottom)); z-index: 9; max-width: 440px; }
.cta .primary { box-shadow: 0 6px 20px rgba(0,0,0,.18); padding: 17px 12px; }
nav { position: fixed; left: 0; right: 0; bottom: 0; background: var(--bg); border-top: 1px solid var(--line); display: flex; padding: 6px 4px calc(6px + env(safe-area-inset-bottom)); z-index: 10; }
nav button { flex: 1; padding: 5px 0; border-radius: 10px; font-size: 11px; color: var(--hint); display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 0; }
nav button b { font-size: 21px; line-height: 1; position: relative; }
nav button.on { color: var(--accent); font-weight: 600; }
.badge { position: absolute; top: -6px; right: -12px; background: var(--accent); color: var(--accent-text); border-radius: 999px; font-size: 10px; padding: 1px 5px; font-weight: 700; }
.toast { position: fixed; left: 50%; bottom: 150px; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; opacity: 0; transition: .2s; pointer-events: none; z-index: 50; max-width: 90vw; text-align: center; }
.toast.show { opacity: .94; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <!-- ============ СПИСОК (главная) ============ -->
  <section id="scr-list">
    <div class="top"><h1>Список</h1><span class="row" style="gap:6px"><button class="icon-btn" data-a="share" id="share-btn" aria-label="Отправить">↗</button><button class="icon-btn" data-a="settings" aria-label="Настройки">⚙️</button></span></div>
    <div id="list-body"></div>
  </section>

  <!-- ============ БЛЮДА ============ -->
  <section id="scr-dishes" hidden>
    <div class="top"><h1>Блюда</h1><button class="icon-btn" data-a="settings" aria-label="Настройки">⚙️</button></div>
    <p class="sub">Нажмите на блюдо — откроется рецепт. «+» внизу — добавить своё.</p>
    <div id="dishes-body"></div>
  </section>

  <!-- ============ ХОЛОДИЛЬНИК ============ -->
  <section id="scr-fridge" hidden>
    <div class="top"><h1>Холодильник</h1><button class="icon-btn" data-a="settings" aria-label="Настройки">⚙️</button></div>
    <p class="sub">Что есть на кухне. Подскажу, что из этого приготовить, а в список покупок это не попадёт.</p>
    <div id="fridge-body"></div>
  </section>

  <!-- ============ РЕЦЕПТЫ ============ -->
  <section id="scr-recipes" hidden>
    <div class="top"><h1>Рецепты</h1><button class="icon-btn" data-a="settings" aria-label="Настройки">⚙️</button></div>
    <div class="card"><input class="field" id="rq" placeholder="Найти рецепт…" autocomplete="off"></div>
    <div class="card" id="all-recipes"></div>
  </section>

  <!-- ============ ИСТОРИЯ ============ -->
  <section id="scr-history" hidden>
    <div class="top"><h1>История</h1><button class="icon-btn" data-a="settings" aria-label="Настройки">⚙️</button></div>
    <p class="sub" id="hist-sub"></p>
    <div id="trips"></div>
  </section>
</div>

<div class="cta" id="cta" hidden><button class="primary" id="cta-btn"></button></div>
<button class="fab" id="fab" data-a="fab" aria-label="Добавить">+</button>
<nav>
  <button data-a="tab" data-x="list" id="tab-list" class="on"><b>🛒<span class="badge" id="badge" hidden></span></b>Список</button>
  <button data-a="tab" data-x="dishes" id="tab-dishes"><b>🍲</b>Блюда</button>
  <button data-a="tab" data-x="fridge" id="tab-fridge"><b>🧊</b>Холодильник</button>
  <button data-a="tab" data-x="recipes" id="tab-recipes"><b>📖</b>Рецепты</button>
  <button data-a="tab" data-x="history" id="tab-history"><b>🕘</b>История</button>
</nav>
<div class="sheet" id="sheet" hidden><div class="panel" id="panel"></div></div>
<div class="sheet center" id="mini" hidden><div class="panel" id="mini-panel"></div></div>
<div class="onb" id="onb" hidden></div>
<datalist id="plist"></datalist>
<input type="file" id="photo-in" accept="image/*" hidden>
<div class="toast" id="toast"></div>

<script>
/* ===================== ССЫЛКИ «ОТПРАВИТЬ СПИСОК» =====================
   Заполните, когда зарегистрируете мини-приложение в @BotFather (/newapp):
   ссылка получится t.me/<botUsername>/<appName>?startapp=… и откроется прямо в Telegram.
   Пусто — отправляется ссылка на сайт приложения, тоже работает. */
const APP = { botUsername: "Pokupki_market_bot", appName: "" };

/* ===================== ОБЩИЙ СПИСОК ДЛЯ СЕМЬИ =====================
   Адрес развёрнутого Apps Script (sync/УСТАНОВКА.md). Пусто — общего списка нет, всё живёт только в телефоне. */
const SYNC_URL_DEFAULT = "https://script.google.com/macros/s/AKfycbzdWddbbaN3lv3Q5ScEdsNnV9AmhP1JOSLwIb2Dlf-toRoWDRvs2BoXrcK7IjHOfnGC/exec";

/* ===================== НАСТРОЙКИ РЕКЛАМЫ =====================
   adsgramBlockId  — блок Adsgram (adsgram.ai), только внутри Telegram
   yandexBlockId   — блок РСЯ (partner.yandex.ru), когда открыто как сайт
   partner         — своя прямая реклама. В РФ нужна маркировка: erid + рекламодатель
   interstitialEvery — полноэкранная Adsgram после каждого N-го завершённого похода в магазин (0 — выкл.)
   ownerContact    — куда писать желающим купить рекламу (видно, пока слот пуст) */
const ADS = {
  adsgramBlockId: "",
  yandexBlockId: "",
  partner: null, // { text: "…", url: "https://…", advertiser: "ООО …", erid: "…" }
  interstitialEvery: 2,
  ownerContact: "",
};

const tg = window.Telegram && Telegram.WebApp && Telegram.WebApp.initData ? Telegram.WebApp : null;
if (tg) { document.documentElement.classList.add("tg"); tg.ready(); tg.expand(); }
const haptic = () => { try { tg && tg.HapticFeedback.selectionChanged(); } catch (e) {} };

/* ===================== ДАННЫЕ ===================== */
const DB = window.DB;
const CATS = DB.categories;
const NOT_FOOD = new Set(["Бытовая химия", "Гигиена", "Для дома и кухни"]);  // в холодильник не кладём
const GROUP_ICON = {"Супы":"🍲","Горячее из мяса и птицы":"🍖","Рыба и морепродукты":"🐟","Гарниры и овощи":"🥔","Паста, пицца, выпечка с начинкой":"🍝","Салаты и закуски":"🥗","Завтраки":"🍳","Десерты и выпечка":"🍰","Напитки":"🥤","Мои рецепты":"⭐","Добавлено ИИ":"✨"};
const POPULAR = ["Борщ","Плов","Оливье","Шашлык","Блины","Котлеты","Картофельное пюре","Паста болоньезе","Цезарь","Курица в духовке","Селёдка под шубой","Пельмени","Сырники","Голубцы","Пицца","Шарлотка","Овощное рагу","Греческий салат","Гречка","Омлет"];
const FISH_POPULAR = ["Сёмга в духовке","Уха","Роллы","Рыба с овощами","Креветки в чесночном соусе","Поке"];

/* ===================== СОСТОЯНИЕ ===================== */
const KEY = "shoplist.v1";
const blank = () => ({
  v: 3, onboarded: false, people: 4, prefs: {diets: [], fish: false}, theme: "auto", showPrices: true, autoFridge: true,
  dishes: [], manual: {}, fromHome: [], checked: {}, order: CATS.map((_, i) => i), history: {},
  trips: [], myPrices: {}, custom: {}, customProducts: {}, fridge: {}, bought: {}, amount: {}, lastQ: "", lastShare: "", lastAdd: "",
});
let S = blank();
try { S = Object.assign(blank(), JSON.parse(localStorage.getItem(KEY) || "{}")); } catch (e) {}
if (S.order.length !== CATS.length) S.order = CATS.map((_, i) => i);
S.dishes = S.dishes.map(d => [d[0], d[1], d[2] || 0]);
if (!S.v || S.v < 2) S.onboarded = S.dishes.length > 0;
S.v = 3;

const FORMS = {"пучок":["пучок","пучка","пучков"],"зуб":["зубчик","зубчика","зубчиков"],"пакет":["пакет","пакета","пакетов"],"банка":["банка","банки","банок"],"бутылка":["бутылка","бутылки","бутылок"],"пачка":["пачка","пачки","пачек"],"десяток":["десяток","десятка","десятков"],"головка":["головка","головки","головок"],"пакетик":["пакетик","пакетика","пакетиков"],"плитка":["плитка","плитки","плиток"],"сырок":["сырок","сырка","сырков"],"бутыль":["бутыль","бутыли","бутылей"],"порция":["порцию","порции","порций"],"продукт":["продукт","продукта","продуктов"]};

/* ===================== СБОРКА СПИСКА =====================

function buildList(dishes = S.dishes, manual = S.manual, fromHome = S.fromHome) {
  const buy = {}, home = {}, suggest = [], f = forbidden();
  for (const [name, servings, v] of dishes) {
    const d = dish(name); if (!d) continue;
    const k = servings / d[0];
    for (const [pid, q] of dishItems(d, v)) {
      if (S.bought[pid]) continue;  // уже купили в прошлый заход
      const atHome = (product(pid)[3] || S.fridge[pid]) && !fromHome.includes(pid);
      const t = atHome ? home : buy;
      t[pid] ??= {pid, qty: 0, count: 0, dishes: []};

      if (!t[pid].dishes.includes(name)) t[pid].dishes.push(name);

    buy[pid] ??= {pid, qty: 0, count: 0, dishes: []};
    buy[pid].count += cnt; delete home[pid];

    if (!buy[pid]) continue;

/* ===================== ХОЛОДИЛЬНИК ===================== */
/* что можно приготовить: соль и специи считаем за имеющиеся, мелочи вроде «по вкусу» не учитываем */
function cookable() {
  const have = Object.keys(S.fridge);
  if (!have.length) return [];
  const f = forbidden(), out = [];
  for (const name of allDishes()) {
    const ft = fit(name, f); if (!ft.ok) continue;
    const d = dish(name);
    const need = dishItems(d, ft.v).filter(([pid, q]) => q > 0 && !product(pid)[3]).map(([pid]) => pid);
    if (need.length < 2) continue;
    const missing = need.filter(pid => !S.fridge[pid]);
    const got = need.length - missing.length;
    if (got < 2 || missing.length > 3 || got / need.length < 0.5) continue;
    out.push({name, missing, got, v: ft.v});
  }
  return out.sort((a, b) => a.missing.length - b.missing.length || b.got - a.got);
}
function renderFridge() {
  const items = Object.entries(S.fridge);
  let html = `<div class="card"><div class="row"><h2 class="h2" style="margin:0">Есть на кухне · ${items.length}</h2>${items.length ? `<button class="ghost small danger" data-a="clearFridge">Очистить</button>` : ""}</div>`;
  if (!items.length) html += `<p class="note">Пока пусто. Нажмите «+» внизу и отметьте, что есть. ${S.autoFridge ? "Купленное по списку будет попадать сюда само." : ""}</p>`;
  else {
    const byCat = {};
    for (const [pid, t] of items) (byCat[product(pid)[4]] ??= []).push([pid, t]);
    for (const ci of S.order) if (byCat[ci]) html += `<div class="small muted" style="margin:10px 0 6px">${esc(CATS[ci])}</div><div class="chips">${byCat[ci].map(([pid, t]) =>
      `<button class="chip" data-a="unfridge" data-x="${esc(pid)}" title="${ago(t)}">${esc(cap(pid))}<span class="x">×</span></button>`).join("")}</div>`;
  }
  html += `</div>`;
  const list = cookable();
  const now = list.filter(c => !c.missing.length), soon = list.filter(c => c.missing.length).slice(0, 12);
  if (now.length) html += `<div class="card"><h2>Можно приготовить сейчас</h2>${now.slice(0, 12).map(c => dishRow(c.name, "всё есть ✓")).join("")}</div>`;
  if (soon.length) html += `<div class="card"><h2>Докупить немного</h2>${soon.map(c => dishRow(c.name, "не хватает: " + esc(c.missing.join(", ")))).join("")}
    <p class="note">«+» добавит блюдо в список — купить нужно будет только то, чего не хватает.</p></div>`;
  if (items.length && !list.length) html += `<div class="card"><p class="note" style="margin:0">Добавьте ещё пару продуктов — подскажу, что из этого приготовить.</p></div>`;
  $("fridge-body").innerHTML = html;
}

function pickPhoto(file) {

    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, 640 / Math.max(img.width, img.height));
      const c = document.createElement("canvas"); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);

/* ===================== ОТПРАВИТЬ СПИСОК ДРУГОМУ =====================
   Весь список (блюда с вариантами, порции, продукты, свои рецепты) упаковывается в ссылку.
   Блюда и продукты кодируются постоянными номерами из data/ids.json. */
const DISH_BY_ID = {}, PROD_BY_ID = {};
for (const [n, d] of Object.entries(DB.dishes)) DISH_BY_ID[d[7]] = n;
for (const [n, p] of Object.entries(DB.products)) PROD_BY_ID[p[7]] = n;
const b64u = str => btoa(String.fromCharCode(...new TextEncoder().encode(str))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
const unb64u = code => new TextDecoder().decode(Uint8Array.from(atob(code.replace(/-/g, "+").replace(/_/g, "/")), c => c.charCodeAt(0)));
const pkey = pid => DB.products[pid] ? DB.products[pid][7] : pid;
function packList(withSteps = true) {
  const c = {};
  for (const [name] of S.dishes) if (S.custom[name]) {
    const r = S.custom[name];
    c[name] = [r.servings, r.items.map(([p, q]) => DB.products[p] ? [pkey(p), q] : [p, q, S.customProducts[p] || "шт"]), r.time || "", withSteps ? r.steps || [] : []];
  }
  const o = {d: S.dishes.map(([name, n, v]) => [DB.dishes[name] ? DB.dishes[name][7] : name, n, v]),
    m: Object.entries(S.manual).map(([p, n]) => [pkey(p), n]), h: S.fromHome.map(pkey)};
  if (Object.keys(S.amount).length) o.a = Object.entries(S.amount).map(([p, q]) => [pkey(p), q]);
  if (Object.keys(c).length) o.c = c;
  return "L" + b64u(JSON.stringify(o));
}

function listText() {
  const {buy, total} = buildList(); const byCat = {};
  for (const l of Object.values(buy)) if (!S.checked[l.pid]) (byCat[product(l.pid)[4]] ??= []).push(l);
  let text = "Список покупок" + (S.showPrices && total ? ` (≈ ${rub(total)})` : "") + "\n";
  for (const ci of S.order) if (byCat[ci]) text += `\n${CATS[ci]}:\n` + byCat[ci].map(l => `— ${l.pid}${fmtQty(l) ? " (" + fmtQty(l).replace(/ · нужно.*$/, "") + ")" : ""}`).join("\n") + "\n";
  return text;
}
function copy(text, ok) {
  (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject()).then(() => toast(ok)).catch(() => {
    const t = document.createElement("textarea"); t.value = text; document.body.appendChild(t); t.select();
    try { document.execCommand("copy"); toast(ok); } catch (e) { toast("Не получилось скопировать"); } t.remove();
  });
}
function shareHtml() {
  const {buy, total} = buildList(), n = Object.keys(buy).length;
  return `<button class="close" data-a="closeSheet" aria-label="Закрыть">×</button><div class="in">
    <h1>Отправить список</h1>
    <p class="sub">Человек откроет ссылку — у него появится этот же список по отделам: ${n} ${plural(n, "продукт")}${S.showPrices && total ? `, ≈ ${rub(total)}` : ""}.</p>
    <div class="card"><div class="h2">Что уйдёт</div><p style="margin:0;white-space:pre-line">${esc(shareData().msg)}</p><p class="note" style="margin-bottom:0">+ ссылка на список</p></div>
    <div class="btns">
      <button class="primary" data-a="sendTg">Отправить в Telegram</button>
      <button class="secondary" data-a="sendAny">${navigator.share ? "Другой мессенджер" : "Скопировать с ссылкой"}</button>
      <button class="ghost" data-a="copyText" style="padding:10px">Скопировать просто текстом</button>
    </div></div>`;
}
function importShared(code) {
  let o;
  try { o = JSON.parse(unb64u(code.slice(1))); } catch (e) { toast("Ссылка на список повреждена"); return; }
  const go = () => {
    for (const [name, [servings, items, time, steps]] of Object.entries(o.c || {})) {
      if (S.custom[name] || DB.dishes[name]) continue;
      S.custom[name] = {servings, time, steps, photo: "", items: items.map(([k, q, unit]) => {
        const pid = typeof k === "number" ? PROD_BY_ID[k] : k;
        if (typeof k !== "number") S.customProducts[pid] = unit || "шт";
        return [pid, q];
      }).filter(([pid]) => pid)};
    }
    registerCustom();
    const dishes = (o.d || []).map(([k, n, v]) => [typeof k === "number" ? DISH_BY_ID[k] : k, n, v || 0]).filter(([name]) => name && dish(name));
    const manual = {};
    for (const [k, n] of o.m || []) { const pid = typeof k === "number" ? PROD_BY_ID[k] : k; if (pid) manual[pid] = n; }
    const amount = {};
    for (const [k, q] of o.a || []) { const pid = typeof k === "number" ? PROD_BY_ID[k] : k; if (pid) amount[pid] = q; }
    const fromHome = (o.h || []).map(k => typeof k === "number" ? PROD_BY_ID[k] : k).filter(Boolean);
    Object.assign(S, {dishes, manual, fromHome, amount, checked: {}, bought: {}, lastShare: code});
    showTab("list"); toast("Список получен — можно идти в магазин 🛒");
  };
  if (S.dishes.length || Object.keys(S.manual).length) confirmBox("Вам прислали список покупок. Заменить им текущий?", go); else go();
}

/* ===================== ДЕЙСТВИЯ ===================== */
function addText(text) {
  const r = parseRequest(text, S.people);
  const miss = [];
  for (const [d, n, v, explicit] of r.dishes) {
    const vv = explicit ? v : fit(d).v;  // сказал «с бараниной» — так и будет, иначе — по питанию и холодильнику
    const i = inList(d);
    i >= 0 ? (S.dishes[i][1] = n, S.dishes[i][2] = vv) : S.dishes.push([d, n, vv]);
  }
  for (const [pid, n, q] of r.products) {
    if (q) { S.amount[pid] = q; if (!(buildList().buy[pid] || {dishes: []}).dishes.length) S.manual[pid] = S.manual[pid] || 1; }  // «молоко 2 л» — ровно столько
    else S.manual[pid] = (S.manual[pid] || 0) + n;
    S.fromHome = S.fromHome.filter(x => x !== pid); delete S.bought[pid];
  }
  for (const [name] of r.unknown) {
    const opts = searchDishes(name);
    if (opts.length) miss.push(`«${name}» — может, ${opts.slice(0, 3).join(", ")}?`);
    else S.manual[name] = (S.manual[name] || 0) + 1;
  }
  if (miss.length) toast(miss[0]);
  else if (r.dishes.length + r.products.length + r.unknown.length) toast("Добавлено в список");
  render();
  return r;
}
function finishTrip() {
  const {buy} = buildList(), lines = Object.values(buy);
  if (!lines.length) return;
  const bought = lines.filter(l => S.checked[l.pid]);
  const now = Date.now();
  for (const l of bought) {
    S.history[l.pid] = now;
    if (S.autoFridge && !NOT_FOOD.has(CATS[product(l.pid)[4]])) S.fridge[l.pid] = now;
  }
  S.trips.unshift({t: now, dishes: S.dishes.map(d => [...d]), manual: {...S.manual}, amount: {...S.amount},
    items: bought.map(l => [l.pid, fmtQty(l).replace(/ · нужно.*$/, ""), Math.round(lineCost(l))]),
    total: Math.round(bought.reduce((s, l) => s + lineCost(l), 0))});
  S.trips = S.trips.slice(0, 60);
  // что не купили — остаётся в списке: блюда на месте, купленное из них больше не показываем
  const left = lines.filter(l => !S.checked[l.pid]);
  if (!left.length) Object.assign(S, {dishes: [], manual: {}, fromHome: [], checked: {}, bought: {}, amount: {}});
  else {
    for (const l of bought) { S.bought[l.pid] = true; delete S.manual[l.pid]; delete S.amount[l.pid]; }
    S.checked = {};
  }
  render();
  toast(`Готово 👍 В истории${S.autoFridge ? ", продукты — в холодильнике" : ""}${left.length ? ` · не купленное (${left.length}) осталось в списке` : ""}`);
  maybeInterstitial();
}
function showTab(t) {
  tab = t;
  for (const k of ["list", "dishes", "fridge", "recipes", "history"]) { $("scr-" + k).hidden = k !== t; $("tab-" + k).classList.toggle("on", k === t); }
  keepAwake(t === "list");
  window.scrollTo(0, 0); render();
}
function refreshOpen() { if (!$("onb").hidden) renderOnb(); else renderSheet(); }

const ACT = {
  tab: el => { if (sheet) { sheet = null; $("sheet").hidden = true; document.body.classList.remove("lock"); } showTab(el.dataset.x); },
  settings: () => openSheet({kind: "settings"}),
  closeSheet, closeMini,
  fab: () => tab === "dishes" ? openEditor(null, false) : openAdd(tab === "fridge" ? "fridge" : "list"),
  addMode: el => { sheet.mode = el.dataset.x; sheet.q = ""; renderSheet(); },
  addEnter: () => {
    const q = sheet.q.trim(); if (!q) return;
    if (sheet.target === "fridge") {
      for (const part of q.split(/[,;\n]|\s+и\s+/)) { const t = part.trim(); if (!t) continue; S.fridge[findProduct(t) || t.toLowerCase()] = Date.now(); }
      toast("Добавлено в холодильник");
    } else addText(q);
    sheet.q = ""; $("add-q").value = ""; renderAddResults(); save();
  },
  addProd: el => { const p = el.dataset.x;
    if (sheet.target === "fridge") S.fridge[p] ? delete S.fridge[p] : (S.fridge[p] = Date.now());
    else if (S.manual[p]) return openQty(p);  // уже в списке — спросим, сколько
    else {
      S.manual[p] = 1; S.fromHome = S.fromHome.filter(x => x !== p); delete S.bought[p];
      haptic(); save(); renderAddResults();
      return openQty(p, true);  // только что добавили — сразу «Сколько?»
    }
    haptic(); save(); renderAddResults(); },
  qty: el => openQty(el.dataset.x),
  qUnit: el => { const o = unitOptions(qd.pid), old = o[qd.u][1]; qd.u = +el.dataset.x; qd.val = roundNice(qd.val * old / o[qd.u][1]); renderQty(); },
  qStep: el => { const st = qtyStep(unitOptions(qd.pid)[qd.u][1]); qd.val = Math.max(0, roundNice(readQty() + st * +el.dataset.x)); renderQty(); },
  qPreset: el => { qd.val = +el.dataset.x; renderQty(); },
  qSave: () => { const v = readQty(), f = unitOptions(qd.pid)[qd.u][1];
    if (v > 0) { S.amount[qd.pid] = v * f; if (!buildList().buy[qd.pid]) S.manual[qd.pid] = S.manual[qd.pid] || 1; } else delete S.amount[qd.pid];
    closeMini(); afterQty(); },
  qClear: () => { const l = buildList().buy[qd.pid];
    delete S.amount[qd.pid]; if (l && l.dishes.length) delete S.manual[qd.pid];  // «как в рецепте» — без ручной добавки
    closeMini(); afterQty(); },
  qRemove: () => { delete S.amount[qd.pid]; delete S.manual[qd.pid]; delete S.checked[qd.pid]; closeMini(); afterQty(); },
  addFree: () => { const q = sheet.q.trim().toLowerCase(); if (!q) return;
    if (sheet.target === "fridge") S.fridge[q] = Date.now(); else S.manual[q] = 1;
    sheet.q = ""; $("add-q").value = ""; haptic(); save(); renderAddResults();
    if (sheet.target !== "fridge") openQty(q, true); },
  toggleDish: el => { const name = el.dataset.x, i = inList(name);
    if (i >= 0) S.dishes.splice(i, 1); else S.dishes.push([name, S.people, fit(name).v]);
    haptic(); save(); if (sheet && sheet.kind === "add") renderAddResults(); else render();
    if (i < 0 && !sheet) toast(`${name} — в списке`); },
  people: el => { S.people = Math.max(1, Math.min(30, S.people + +el.dataset.x)); save(); refreshOpen(); },
  serv: el => { const x = S.dishes[+el.dataset.x]; x[1] = Math.max(1, Math.min(100, x[1] + +el.dataset.y)); save(); if (sheet && sheet.kind === "add") renderAddResults(); else render(); },
  rmDish: el => { S.dishes.splice(+el.dataset.x, 1); render(); },
  check: el => { const p = el.dataset.x; S.checked[p] = !S.checked[p]; haptic(); render(); },
  nohome: el => { S.fromHome.push(el.dataset.x); render(); },
  sug: el => { S.manual[el.dataset.x] = (S.manual[el.dataset.x] || 0) + 1; render(); },
  finish: () => { const any = Object.keys(buildList().buy).some(p => S.checked[p]);
    if (!any) return toast("Отметьте, что купили, — потом «Завершить»");
    confirmBox("Завершить покупки? Купленное уйдёт в историю, не купленное останется в списке.", finishTrip); },
  reset: () => confirmBox("Очистить список без сохранения?", () => { Object.assign(S, {dishes: [], manual: {}, fromHome: [], checked: {}, bought: {}, amount: {}}); render(); }),
  share: () => { if (!S.dishes.length && !Object.keys(S.manual).length) return toast("Список пуст"); openSheet({kind: "share"}); },
  sendTg: () => { const {link, msg} = shareData(); const url = "https://t.me/share/url?url=" + encodeURIComponent(link) + "&text=" + encodeURIComponent(msg);
    tg ? tg.openTelegramLink(url) : window.open(url, "_blank"); },
  sendAny: () => { const {link, msg} = shareData(); navigator.share ? navigator.share({text: msg + "\n" + link}).catch(() => {}) : ACT.copyLink(); },
  copyLink: () => { const {link, msg} = shareData(); copy(msg + "\n" + link, "Скопировано — вставьте в любой мессенджер"); },
  copyText: () => copy(listText(), "Список скопирован текстом"),
  price: el => openPrice(el.dataset.x),
  priceSave: el => { const v = parseFloat($("price-in").value.replace(",", ".")); if (v > 0) S.myPrices[el.dataset.x] = v; else delete S.myPrices[el.dataset.x]; closeMini(); render(); },
  priceReset: el => { delete S.myPrices[el.dataset.x]; closeMini(); render(); },
  recipe: el => { const name = el.dataset.x, i = inList(name);
    openSheet({kind: "recipe", name, n: i >= 0 ? S.dishes[i][1] : S.people, v: i >= 0 ? S.dishes[i][2] : fit(name).v}); },
  rVariant: el => { sheet.v = +el.dataset.x; renderSheet(); },
  rServ: el => { sheet.n = Math.max(1, Math.min(100, sheet.n + +el.dataset.x)); renderSheet(); },
  rAdd: () => { const i = inList(sheet.name);
    i >= 0 ? (S.dishes[i][1] = sheet.n, S.dishes[i][2] = sheet.v) : S.dishes.push([sheet.name, sheet.n, sheet.v]);
    haptic(); toast(`${dishTitle(sheet.name, sheet.v)} — в списке`); closeSheet(); },
  cooked: () => { const d = dish(sheet.name);
    for (const [pid] of dishItems(d, sheet.v)) if (!product(pid)[3]) delete S.fridge[pid];
    toast("Приятного аппетита! Продукты убраны из холодильника"); closeSheet(); },
  forkRecipe: () => openEditor(sheet.name, true),
  editRecipe: () => openEditor(sheet.name, false),
  delRecipe: () => { const name = sheet.name; confirmBox(`Удалить «${name}»?`, () => { delete S.custom[name]; S.dishes = S.dishes.filter(d => d[0] !== name); closeSheet(); }); },
  newRecipe: () => openEditor(null, false),
  eServ: el => { sheet.servings = Math.max(1, Math.min(50, sheet.servings + +el.dataset.x)); renderSheet(); },
  eAddRow: () => { sheet.rows.push({name: "", qty: "", unit: "г"}); renderSheet(); const ins = $("panel").querySelectorAll('[data-e="rname"]'); ins[ins.length - 1].focus(); },
  eRmRow: el => { sheet.rows.splice(+el.dataset.x, 1); renderSheet(); },
  eSave: () => saveEditor(),
  pickPhoto: () => $("photo-in").click(),
  rmPhoto: () => { sheet.photo = ""; renderSheet(); },
  unfridge: el => { delete S.fridge[el.dataset.x]; haptic(); render(); },
  clearFridge: () => confirmBox("Убрать всё из холодильника?", () => { S.fridge = {}; render(); }),
  diet: el => { const k = el.dataset.x, d = S.prefs.diets; d.includes(k) ? d.splice(d.indexOf(k), 1) : d.push(k);
    S.dishes.forEach(x => { const dd = dish(x[0]); if (dd && dd[4].length && isBad(dd[4][x[2]][1])) x[2] = fit(x[0]).v; });
    haptic(); save(); refreshOpen(); },
  fish: () => { S.prefs.fish = !S.prefs.fish; save(); refreshOpen(); },
  theme: el => { S.theme = el.dataset.x; applyTheme(); save(); refreshOpen(); },
  togglePrices: () => { S.showPrices = !S.showPrices; save(); refreshOpen(); },
  toggleAutoFridge: () => { S.autoFridge = !S.autoFridge; save(); refreshOpen(); },
  resetPrices: () => confirmBox("Вернуть средние цены везде?", () => { S.myPrices = {}; save(); renderSheet(); }),
  up: el => { const i = +el.dataset.x; if (i > 0) { [S.order[i], S.order[i - 1]] = [S.order[i - 1], S.order[i]]; save(); renderSheet(); } },
  down: el => { const i = +el.dataset.x; if (i < S.order.length - 1) { [S.order[i], S.order[i + 1]] = [S.order[i + 1], S.order[i]]; save(); renderSheet(); } },
  clearHistory: () => confirmBox("Удалить всю историю покупок?", () => { S.trips = []; save(); renderSheet(); }),
  onboard: () => { closeSheet(); showOnb(); },
  onbNext: () => { if (onbStep < 2) { onbStep++; renderOnb(); } else finishOnb(); },
  onbBack: () => { onbStep = Math.max(0, onbStep - 1); renderOnb(); },
  onbSkip: () => finishOnb(),
  repeat: el => { const t = S.trips[+el.dataset.x];
    const go = () => { S.dishes = t.dishes.map(d => [...d]); S.manual = {...(t.manual || Object.fromEntries(t.items.map(([p]) => [p, 1])))}; S.checked = {}; S.fromHome = []; S.bought = {}; S.amount = {...(t.amount || {})}; showTab("list"); toast("Список восстановлен"); };
    S.dishes.length || Object.keys(S.manual).length ? confirmBox("Заменить текущий список этим?", go) : go(); },
  rmTrip: el => confirmBox("Удалить эту запись?", () => { S.trips.splice(+el.dataset.x, 1); render(); }),
};

document.addEventListener("click", e => {
  const el = e.target.closest("[data-a]");
  if (!el) { if (e.target === $("sheet")) closeSheet(); if (e.target === $("mini")) closeMini(); return; }
  const fn = ACT[el.dataset.a]; if (fn) fn(el);
});
document.addEventListener("input", e => {
  if (e.target.id === "add-q" && sheet) { sheet.q = e.target.value; renderAddResults(); return; }
  if (e.target.id === "rq") { renderRecipes(); return; }
  if (e.target.id === "my-name") { S.myName = e.target.value.trim().slice(0, 30); save(); return; }
  const k = e.target.dataset.e;
  if (k && sheet && sheet.kind === "editor") {  // поля редактора — без перерисовки, чтобы не терять фокус
    const i = +e.target.dataset.i;
    if (k === "rname") sheet.rows[i].name = e.target.value;
    else if (k === "rqty") sheet.rows[i].qty = e.target.value;
    else if (k === "runit") sheet.rows[i].unit = e.target.value;
    else sheet[k] = e.target.value;
  }
});
document.addEventListener("change", e => { if (e.target.dataset.e === "rname" && sheet && sheet.kind === "editor") renderSheet(); });
document.addEventListener("keydown", e => {
  if (e.key !== "Enter") return;
  if (e.target.id === "add-q") { e.preventDefault(); ACT.addEnter(); }
  if (e.target.id === "price-in") document.querySelector('[data-a="priceSave"]').click();
});
$("photo-in").addEventListener("change", e => { const f = e.target.files[0]; if (f && sheet) pickPhoto(f); e.target.value = ""; });

function render() {
  renderList();  // бейдж на вкладке нужен всегда
  if (tab === "dishes") renderDishes();
  if (tab === "fridge") renderFridge();
  if (tab === "recipes") renderRecipes();
  if (tab === "history") renderHistory();
  save(); updateMain();
}

/* ===================== РЕКЛАМА ===================== */
function loadScript(src) { return new Promise((ok, fail) => { const s = document.createElement("script"); s.src = src; s.async = true; s.onload = ok; s.onerror = fail; document.head.appendChild(s); }); }
function renderAds() {
  const top = $("ad-top"), bottom = $("ad-bottom");
  if (top) {
    if (ADS.partner && ADS.partner.text) {
      const p = ADS.partner;
      top.innerHTML = `<div class="lbl">Реклама${p.advertiser ? " · " + esc(p.advertiser) : ""}${p.erid ? " · erid: " + esc(p.erid) : ""}</div>` +
        (p.url ? `<a href="${esc(p.url)}" target="_blank" rel="noopener sponsored">${esc(p.text)}</a>` : esc(p.text));
    } else if (ADS.ownerContact) top.innerHTML = `<div class="lbl">Место для рекламы</div>Ваш магазин или доставка здесь — пишите ${esc(ADS.ownerContact)}`;
  }
  if (bottom && ADS.yandexBlockId && !tg) {
    bottom.innerHTML = `<div id="yandex_rtb_${esc(ADS.yandexBlockId)}"></div>`;
    window.yaContextCb = window.yaContextCb || [];
    window.yaContextCb.push(() => Ya.Context.AdvManager.render({blockId: ADS.yandexBlockId, renderTo: "yandex_rtb_" + ADS.yandexBlockId}));
    if (!window.Ya) loadScript("https://yandex.ru/ads/system/context.js").catch(() => {});
  }
}
let adsgram = null;
async function maybeInterstitial() {
  if (!tg || !ADS.adsgramBlockId || !ADS.interstitialEvery || S.trips.length % ADS.interstitialEvery) return;
  try {
    if (!window.Adsgram) await loadScript("https://sad.adsgram.ai/js/sad.min.js");
    adsgram ??= window.Adsgram.init({blockId: ADS.adsgramBlockId});
    await adsgram.show();
  } catch (e) { /* реклама не загрузилась — не мешаем */ }
}

/* ===================== ИЗ БОТА: ФОТО ЧЕКА ИЛИ ХОЛОДИЛЬНИКА =====================
   ?add=… : f — продукты в холодильник, p — цены из чека [продукт, цена], r — это чек (купленное вычеркнуть из списка) */
function importAdd(code) {
  let o;
  try { o = JSON.parse(unb64u(code)); } catch (e) { toast("Не получилось прочитать данные из бота"); return null; }
  const key = k => typeof k === "number" ? PROD_BY_ID[k] : k;
  const now = Date.now(), {buy} = buildList();
  let nf = 0, np = 0, nc = 0;
  for (const k of o.f || []) {
    const pid = key(k); if (!pid) continue;
    if (!NOT_FOOD.has(CATS[product(pid)[4]])) { S.fridge[pid] = now; nf++; }
    if (o.r && buy[pid] && !S.checked[pid]) { S.checked[pid] = true; nc++; }
  }
  for (const [k, price] of o.p || []) { const pid = key(k); if (pid && price > 0) { S.myPrices[pid] = price; np++; } }
  const parts = [];
  if (nf) parts.push(`в холодильнике +${nf}`);
  if (np) parts.push(`цен обновлено: ${np}`);
  if (nc) parts.push(`отмечено купленным: ${nc}`);
  toast(parts.length ? "Готово: " + parts.join(", ") : "Нечего добавлять");
  return nc ? "list" : nf ? "fridge" : "list";
}

/* ===================== ОБЩИЙ СПИСОК: СИНХРОНИЗАЦИЯ =====================
   Общее у семьи: блюда, продукты, количества, отметки «куплено», холодильник, история, рецепты из списка.
   Каждое изменение превращается в маленькие операции и уходит на сервер; чужие изменения
   приходят раз в несколько секунд. Если связи нет — операции копятся и уйдут позже. */
const SYNC_URL = SYNC_URL_DEFAULT || (() => { try { return localStorage.getItem("shoplist.syncUrl") || ""; } catch (e) { return ""; } })();
const SHARED = ["dishes", "manual", "amount", "checked", "fromHome", "bought", "fridge", "trips", "recipes"];
const SYNC = {pending: S.pend || [], inflight: false, shadow: null, timer: null, status: "", lastChange: 0, lastSeen: 0};
/* неотправленное храним в телефоне: закрыли приложение без связи — уйдёт при следующем открытии */
function keepPending() { S.pend = SYNC.pending; try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
if (!S.uid) S.uid = tg && tg.initDataUnsafe && tg.initDataUnsafe.user ? "tg" + tg.initDataUnsafe.user.id : "w" + Math.random().toString(36).slice(2, 12);
const myName = () => S.myName || (tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.first_name) || "Без имени";
function famOn() { return !!(SYNC_URL && S.family && S.family.id); }

/* текущее состояние списка — в виде словарей, которые удобно сравнивать */
function sharedSnap() {
  const recipes = {};
  for (const [n] of S.dishes) if (S.custom[n]) {
    const units = {};
    for (const [pid] of S.custom[n].items) if (S.customProducts[pid]) units[pid] = S.customProducts[pid];
    recipes[n] = {...S.custom[n], photo: "", units};
  }
  return {
    dishes: Object.fromEntries(S.dishes.map(([n, c, v]) => [n, [c, v || 0]])),
    manual: {...S.manual}, amount: {...S.amount},
    checked: Object.fromEntries(Object.entries(S.checked).filter(([, v]) => v)),
    fromHome: Object.fromEntries(S.fromHome.map(p => [p, 1])),
    bought: {...S.bought}, fridge: {...S.fridge},
    trips: Object.fromEntries(S.trips.slice(0, 15).map(t => [String(t.t), t])),
    recipes,
  };
}
function diffOps(a, b) {
  const ops = [], me = [S.uid, myName()];
  for (const f of SHARED) {
    const A = (a && a[f]) || {}, B = b[f] || {};
    for (const k of Object.keys(B)) if (JSON.stringify(A[k]) !== JSON.stringify(B[k])) {
      ops.push(["s", f, k, B[k]]);
      if ((f === "manual" || f === "dishes") && !(k in A)) ops.push(["s", "by", f + ":" + k, me]);  // кто добавил
    }
    for (const k of Object.keys(A)) if (!(k in B)) {
      ops.push(["d", f, k]);
      if (f === "manual" || f === "dishes") ops.push(["d", "by", f + ":" + k]);
    }
  }
  return ops;
}
function applyOps(doc, ops) {  // то же, что на сервере
  for (const [kind, f, k, v] of ops) {
    if (![...SHARED, "by"].includes(f)) continue;
    if (!doc[f] || typeof doc[f] !== "object") doc[f] = {};
    if (kind === "c") doc[f] = {};
    else if (kind === "s") doc[f][k] = v;
    else if (kind === "d") delete doc[f][k];
  }
  return doc;
}
/* общий список с сервера → в приложение */
function applyDoc(doc) {
  for (const [n, r] of Object.entries(doc.recipes || {})) if (!S.custom[n] && !DB.dishes[n]) {
    S.custom[n] = {servings: r.servings, time: r.time || "", items: r.items || [], steps: r.steps || [], photo: ""};
    Object.assign(S.customProducts, r.units || {});
  }
  registerCustom();
  S.dishes = Object.entries(doc.dishes || {}).map(([n, [c, v]]) => [n, c, v || 0]);
  S.manual = {...(doc.manual || {})}; S.amount = {...(doc.amount || {})}; S.checked = {...(doc.checked || {})};
  S.fromHome = Object.keys(doc.fromHome || {}); S.bought = {...(doc.bought || {})}; S.fridge = {...(doc.fridge || {})};
  const famTrips = Object.values(doc.trips || {}).sort((a, b) => b.t - a.t);
  const oldest = famTrips.length ? famTrips[famTrips.length - 1].t : Infinity;
  S.trips = [...famTrips, ...S.trips.filter(t => t.t < oldest)].slice(0, 60);  // старше общего окна — свои
  S.by = doc.by || {}; S.members = doc.members || {};
}
async function api(body) {
  const r = await fetch(SYNC_URL, {method: "POST", body: JSON.stringify({...body, uid: S.uid, name: myName()}), headers: {"Content-Type": "text/plain;charset=utf-8"}});
  return r.json();
}
/* приняли ответ сервера: его версия + то, что мы ещё не успели отправить */
function receive(r, fromPoll) {
  if (!r || r.error) {
    if (r && r.error === "no_family") { toast("Общий список удалён. Список остался у вас."); S.family = null; save(); render(); }
    return;
  }
  const changed = r.doc && r.v !== S.family.v;
  S.family.v = r.v;
  if (!r.doc) return;
  applyDoc(applyOps(JSON.parse(JSON.stringify(r.doc)), SYNC.pending));
  SYNC.shadow = sharedSnap();
  SYNC.lastSeen = Date.now();
  if (changed) SYNC.lastChange = Date.now();
  save();
  if (sheet && sheet.kind === "add") renderAddResults(); else render();
  if (fromPoll && changed) { haptic(); toast("Список обновился"); }
}
function syncLocal() {
  if (!famOn() || !SYNC.shadow) return;
  const cur = sharedSnap(), ops = diffOps(SYNC.shadow, cur);
  if (!ops.length) return;
  SYNC.pending.push(...ops); SYNC.shadow = cur; SYNC.lastChange = Date.now(); keepPending();
  clearTimeout(SYNC.timer); SYNC.timer = setTimeout(flush, 700);
}
async function flush() {
  if (!famOn() || SYNC.inflight || !SYNC.pending.length) return;
  SYNC.inflight = true;
  const sending = SYNC.pending.slice(0, 300);
  try {
    const r = await api({action: "ops", f: S.family.id, ops: sending});
    if (!r.error) { SYNC.pending = SYNC.pending.slice(sending.length); keepPending(); }
    setStatus("");
    receive(r);
  } catch (e) {
    setStatus("offline");
    clearTimeout(SYNC.timer); SYNC.timer = setTimeout(flush, 5000);
  } finally {
    SYNC.inflight = false;
    if (SYNC.pending.length && SYNC.status !== "offline") { clearTimeout(SYNC.timer); SYNC.timer = setTimeout(flush, 300); }
  }
}
async function poll() {
  if (!famOn() || document.hidden || SYNC.inflight || SYNC.pending.length) return;
  try {
    const r = await fetch(`${SYNC_URL}?f=${S.family.id}&v=${S.family.v || 0}`).then(x => x.json());
    setStatus(""); receive(r, true);
  } catch (e) { setStatus("offline"); }
}
function setStatus(st) { if (SYNC.status !== st) { SYNC.status = st; if (tab === "list" && !sheet) renderList(); } }
// чаще, пока в списке что-то меняется, реже — когда тихо
(function loop() { const busy = Date.now() - SYNC.lastChange < 120000; setTimeout(() => { poll().finally(loop); }, busy ? 4000 : 10000); })();
document.addEventListener("visibilitychange", () => { if (!document.hidden) { poll(); flush(); } });

/* --- создать, пригласить, вступить, выйти --- */
async function famCreate() {
  if (!SYNC_URL) return;
  toast("Создаю общий список…");
  try {
    const r = await api({action: "create", doc: sharedSnap()});
    if (r.error) return toast(r.error === "too_many" ? "Слишком часто, попробуйте позже" : "Не получилось создать");
    S.family = {id: r.id, v: r.v}; SYNC.pending = [];
    receive(r); renderSheet(); famInvite();
  } catch (e) { toast("Нет связи с сервером"); }
}
function famLink() {
  const id = S.family.id;
  // через бота: /start F<id> → бот присылает кнопку, приложение открывается в Telegram (работает и без регистрации мини-приложения)
  if (APP.botUsername && APP.appName) return `https://t.me/${APP.botUsername}/${APP.appName}?startapp=F${id}`;
  if (APP.botUsername) return `https://t.me/${APP.botUsername}?start=F${id}`;
  return `${location.origin}${location.pathname}?fam=${id}`;
}
function famInvite() {
  const link = famLink(), msg = "Давай вести список покупок вместе: открой ссылку, и у нас будет один список на двоих. Что добавишь ты — сразу увижу я.";
  const url = "https://t.me/share/url?url=" + encodeURIComponent(link) + "&text=" + encodeURIComponent(msg);
  if (tg) tg.openTelegramLink(url); else if (navigator.share) navigator.share({text: msg + "\n" + link}).catch(() => {}); else copy(msg + "\n" + link, "Ссылка скопирована — отправьте её семье");
}
async function famJoin(id) {
  if (!SYNC_URL || !/^[a-f0-9]{20}$/.test(id)) return;
  if (S.family && S.family.id === id) return;
  let r;
  try { r = await fetch(`${SYNC_URL}?f=${id}&v=0`).then(x => x.json()); } catch (e) { return toast("Нет связи — попробуйте открыть ссылку позже"); }
  if (!r || !r.doc) return toast("Такого общего списка уже нет");
  const go = () => {
    // своё, чего нет в общем списке, — добавим туда
    const mine = sharedSnap(), add = [];
    for (const op of diffOps({}, mine)) if (op[0] === "s" && !(r.doc[op[1]] && op[2] in r.doc[op[1]])) add.push(op);
    S.family = {id, v: 0}; SYNC.pending = add;
    receive(r); showTab("list"); flush();
    const names = Object.values(r.doc.members || {}).map(m => m.name).filter(Boolean);
    toast(`Готово, список общий${names.length ? ". Ещё в нём: " + names.join(", ") : ""} 👋`);
  };
  confirmBox(S.family ? "Перейти в другой общий список?" : "Вас пригласили вести общий список покупок. Присоединиться? Ваш текущий список тоже туда попадёт.", go);
}
function famLeave() {
  confirmBox("Выйти из общего списка? Сам список останется у вас, но изменения семьи больше не будут приходить.", () => {
    S.family = null; S.by = {}; S.members = {}; SYNC.pending = []; SYNC.shadow = null; keepPending(); save(); renderSheet(); render(); toast("Теперь список только ваш");
  });
}
ACT.famCreate = famCreate; ACT.famInvite = famInvite; ACT.famLeave = famLeave;

function others() { return Object.entries(S.members || {}).filter(([u]) => u !== S.uid).map(([, m]) => m.name); }
function familyBar() {
  if (!famOn()) return "";
  const names = others();
  const state = SYNC.status === "offline" ? `<span class="warn">нет связи — отправлю, когда появится</span>` : SYNC.pending.length ? "сохраняю…" : "всё сохранено";
  return `<p class="sub" style="margin:0 0 6px">👨‍👩‍👧 Общий список · ${names.length ? esc(names.join(", ")) + " и вы" : "пока только вы"} · ${state}</p>`;
}
function whoHtml(key) {
  const w = famOn() && S.by && S.by[key];
  return w && w[0] !== S.uid ? `<div class="for">👤 ${esc(w[1])}</div>` : "";
}
function familyHtml() {
  if (!SYNC_URL) return "";
  const nameField = `<div class="h2" style="text-transform:none;letter-spacing:0;font-size:14px;margin-top:10px">Как вас подписывать</div>
    <input class="field" id="my-name" value="${esc(S.myName || myName())}" placeholder="Маша" style="margin-bottom:10px">`;
  if (!famOn()) return `<div class="card"><h2>Общий список с семьёй</h2>
    <p class="note" style="margin-top:0">Один список на всех: кто-то дописал молоко — у остальных оно появилось через пару секунд. Купленное вычёркивается у всех, холодильник тоже общий.</p>
    ${nameField}<button class="primary" data-a="famCreate">Создать общий список</button></div>`;
  const names = others();
  return `<div class="card"><h2>Общий список с семьёй</h2>
    <p style="margin:0 0 6px">${names.length ? "Вместе с вами: " + esc(names.join(", ")) : "Пока только вы — пригласите семью"}</p>
    ${nameField}
    <div class="btns"><button class="primary" data-a="famInvite">Пригласить</button>
    <button class="ghost danger" data-a="famLeave" style="padding:8px">Выйти из общего списка</button></div></div>`;
}

/* ===================== СТАРТ ===================== */
registerCustom();
$("plist").innerHTML = Object.keys(DB.products).map(p => `<option value="${esc(p)}">`).join("");
applyTheme();
const params = new URLSearchParams(location.search);
const incoming = params.get("q");
if (incoming && incoming !== S.lastQ) { S.lastQ = incoming; addText(incoming); }  // пришли из бота с готовым запросом — дописываем в список
const shared = (tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param) || params.get("tgWebAppStartParam") || params.get("l");
let startTab = "list";
const fromBot = params.get("add");
if (fromBot && fromBot !== S.lastAdd) { S.lastAdd = fromBot; S.onboarded = true; startTab = importAdd(fromBot) || "list"; }
showTab(startTab);
const famInviteId = params.get("fam") || (shared && shared[0] === "F" ? shared.slice(1) : "");
if (shared && shared[0] === "L" && shared !== S.lastShare) { S.onboarded = true; importShared(shared); }
else if (famInviteId) { S.onboarded = true; famJoin(famInviteId); }
else if (!S.onboarded) { showOnb(); if (!S.dishes.length) cloudRestore(); }
if (famOn()) { SYNC.shadow = sharedSnap(); SYNC.pending.length ? flush() : poll(); }  // уже в семье — отправить накопленное и подтянуть свежее
</script>
</body>
</html>
